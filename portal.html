<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#082d5c">
  <meta name="description" content="London Language School management portal">
  <title>LLS Portal | London Language School</title>
  <link rel="stylesheet" href="portal.css">
</head>

<body>

  <!-- =========================
       ADMIN LOGIN GATE (V15)
       Covers the whole portal until a valid session is confirmed.
  ========================== -->
  <div class="admin-login-gate" id="adminLoginGate">
    <div class="admin-login-card">
      <p class="eyebrow">LONDON LANGUAGE SCHOOL</p>
      <h1>Staff portal login</h1>
      <p class="muted">Enter the portal password to continue.</p>
      <form id="adminLoginForm">
        <div class="form-field">
          <label for="adminLoginPassword">Password</label>
          <input id="adminLoginPassword" type="password" autocomplete="current-password" required>
        </div>
        <button class="button button-primary" type="submit" id="adminLoginSubmit">Log in</button>
        <p id="adminLoginError" class="form-error" style="display:none;"></p>
      </form>
    </div>
  </div>

  <div class="app-shell">

    <!-- =========================
         MOBILE OVERLAY
    ========================== -->
    <button
      class="sidebar-overlay"
      id="sidebarOverlay"
      aria-label="Close navigation"
      type="button"
    ></button>

    <!-- =========================
         SIDEBAR
    ========================== -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span class="brand-mark-main">LLS</span>
        </div>

        <div class="brand-copy">
          <strong>London</strong>
          <span>Language School</span>
        </div>
      </div>

      <div class="brand-tagline">We make English fun!</div>

      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="dashboard" type="button">
          <span
