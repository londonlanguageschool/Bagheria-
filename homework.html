<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>My English | London Language School</title>
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="homework.webmanifest">
  <meta name="theme-color" content="#0b3b78">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LLS Homework">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&family=Nunito:wght@500;600;700;800&family=Patrick+Hand&display=swap">
  <style>
    :root {
      --navy-950: #061b37;
      --navy-800: #0b3b78;
      --navy-100: #eaf1fa;
      --navy-50: #f4f7fc;
      --red-600: #ee3124;
      --red-100: #ffe9e6;
      --green-700: #177b52;
      --green-100: #e3f4ec;
      --amber-700: #9a5a0c;
      --amber-100: #fdf1dc;
      --ink-900: #14213d;
      --ink-600: #56617a;
      --ink-200: #dfe4ec;
      --card: #ffffff;
      --page: #f6f8fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink-900);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.45;
    }

    header {
      background: linear-gradient(180deg, var(--navy-950), var(--navy-800));
      color: #fff;
      padding: 20px 16px 28px;
    }

    .wrap { max-width: 640px; margin: 0 auto; }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 44px; height: 44px; border-radius: 50%; background: #fff; object-fit: contain; }
    .brand strong { display: block; font-size: 17px; letter-spacing: .02em; }
    .brand span { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 13px; opacity: .85; }

    h1 { font-size: 26px; margin: 22px 0 4px; }
    .sub { margin: 0; opacity: .85; font-size: 14px; }

    .progress-card {
      background: var(--card);
      color: var(--ink-900);
      border-radius: 14px;
      padding: 16px;
      margin: -14px auto 0;
      box-shadow: 0 6px 20px rgba(6, 27, 55, .10);
    }
    .progress-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .progress-top strong { font-size: 15px; }
    .progress-top span { font-size: 14px; color: var(--ink-600); }
    .bar { height: 12px; background: var(--navy-100); border-radius: 99px; overflow: hidden; margin-top: 10px; }
    .bar div { height: 100%; width: 0; background: var(--green-700); border-radius: 99px; transition: width .4s ease; }

    main { padding: 8px 16px 40px; }

    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-600); margin: 26px 0 10px; }

    .item {
      background: var(--card);
      border: 1px solid var(--ink-200);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 12px;
      align-items: start;
    }
    .item.done { background: var(--navy-50); }
    .item.done .title { text-decoration: line-through; color: var(--ink-600); }
    .title { font-weight: 700; font-size: 16px; margin: 0; overflow-wrap: anywhere; }
    .meta { font-size: 13px; color: var(--ink-600); margin: 2px 0 0; }
    .desc { grid-column: 1 / -1; font-size: 14px; margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }

    .due { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; margin-top: 6px; }
    .due.soon { background: var(--amber-100); color: var(--amber-700); }
    .due.late { background: var(--red-100); color: #b3261e; }
    .due.ok { background: var(--navy-100); color: var(--navy-800); }

    .tick {
      min-width: 92px;
      min-height: 44px;
      border: 2px solid var(--green-700);
      background: #fff;
      color: var(--green-700);
      border-radius: 10px;
      font: inherit;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      padding: 6px 10px;
    }
    .tick.is-done { background: var(--green-700); color: #fff; }
    .tick:disabled { opacity: .6; cursor: wait; }

    .empty, .error {
      background: var(--card);
      border: 1px dashed var(--ink-200);
      border-radius: 14px;
      padding: 22px 16px;
      text-align: center;
      color: var(--ink-600);
    }
    .error { border-style: solid; border-color: var(--red-600); color: var(--ink-900); }

    .classes { font-size: 13px; color: var(--ink-600); margin-top: 8px; }


    /* V18: tabs + practice */
    .tabs { display: flex; gap: 8px; margin: 18px 0 4px; }
    .tabs[hidden] { display: none; }
    .tab {
      flex: 1; min-height: 44px; border: 2px solid var(--navy-800); background: #fff; color: var(--navy-800);
      border-radius: 12px; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer;
    }
    .tab[aria-selected="true"] { background: var(--navy-800); color: #fff; }
    .split { font-size: 13px; color: var(--ink-600); margin-top: 6px; }

    .course { background: var(--card); border: 1px solid var(--ink-200); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
    .course h3 { margin: 0; font-size: 17px; }
    .course .meta { margin-top: 2px; }
    details.unit { border-top: 1px solid var(--ink-200); padding: 10px 0 4px; margin-top: 10px; }
    details.unit summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 8px; min-height: 32px; align-items: center; }
    details.unit summary::-webkit-details-marker { display: none; }
    details.unit summary::after { content: "▾"; color: var(--ink-600); }
    details.unit[open] summary::after { content: "▴"; }
    .now { font-size: 12px; font-weight: 700; background: var(--amber-100); color: var(--amber-700); border-radius: 99px; padding: 2px 8px; margin-left: 6px; }
    .count { font-size: 13px; font-weight: 600; color: var(--ink-600); margin-left: auto; margin-right: 6px; }
    .lesson { padding: 10px 0; border-bottom: 1px dashed var(--ink-200); }
    .lesson:last-child { border-bottom: 0; }
    .lesson-title { font-weight: 700; font-size: 15px; margin: 0; }
    .lesson-topic { font-size: 13px; color: var(--ink-600); margin: 2px 0 8px; }
    .sets { display: flex; flex-wrap: wrap; gap: 8px; }
    .set {
      min-height: 40px; border: 1.5px solid var(--ink-200); background: var(--navy-50); color: var(--ink-900);
      border-radius: 10px; padding: 6px 12px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .set.passed { border-color: var(--green-700); background: var(--green-100); color: var(--green-700); }
    .set.tried { border-color: var(--amber-700); background: var(--amber-100); color: var(--amber-700); }
    .set.review { border-style: dashed; }
    .set.test { border-color: var(--navy-800); background: #fff; color: var(--navy-800); }
    .set.test.passed { border-color: var(--green-700); background: var(--green-100); color: var(--green-700); }
    .set:disabled { opacity: .55; cursor: not-allowed; }
    .extra-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0 4px; border-top: 1px dashed var(--ink-200); }
    .option.picked { border-color: var(--navy-800); background: var(--navy-100); }
    .answers { display: grid; gap: 10px; margin-top: 14px; text-align: left; }
    .answer { border: 1px solid var(--ink-200); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
    .answer.ok { border-color: var(--green-700); }
    .answer.no { border-color: var(--red-600); }
    .answer p { margin: 2px 0; }
    .picker { background: var(--card); border: 1px solid var(--ink-200); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
    .picker label { font-size: 14px; font-weight: 600; display: block; margin-bottom: 6px; }
    select.big, input.big {
      width: 100%; min-height: 46px; font: inherit; font-size: 16px; padding: 8px 12px;
      border: 1.5px solid var(--ink-200); border-radius: 10px; background: #fff; color: var(--ink-900);
    }

    .quiz { background: var(--card); border: 1px solid var(--ink-200); border-radius: 14px; padding: 16px; margin-top: 18px; }
    .quiz-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-600); }
    .link { background: none; border: 0; color: var(--navy-800); font: inherit; font-weight: 700; cursor: pointer; padding: 8px 0; min-height: 40px; }
    .dots { display: flex; gap: 5px; margin: 10px 0 14px; }
    .dots span { flex: 1; height: 6px; border-radius: 99px; background: var(--navy-100); }
    .dots span.ok { background: var(--green-700); }
    .dots span.no { background: var(--red-600); }
    .dots span.cur { background: var(--navy-800); }
    .question { font-size: 19px; font-weight: 600; margin: 0 0 14px; overflow-wrap: anywhere; }
    .blank { display: inline-block; min-width: 56px; border-bottom: 2.5px solid var(--navy-800); margin: 0 2px; }
    .options { display: grid; gap: 10px; }
    .option {
      text-align: left; min-height: 50px; border: 2px solid var(--ink-200); background: #fff; color: var(--ink-900);
      border-radius: 12px; padding: 10px 14px; font: inherit; font-size: 17px; cursor: pointer;
    }
    .option.right { border-color: var(--green-700); background: var(--green-100); }
    .option.wrong { border-color: var(--red-600); background: var(--red-100); }
    .option:disabled { cursor: default; }
    .typed { display: flex; gap: 8px; }
    .typed input { flex: 1; }
    .primary {
      min-height: 46px; border: 0; background: var(--navy-800); color: #fff; border-radius: 12px;
      padding: 10px 18px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .primary:disabled { opacity: .5; cursor: default; }
    .secondary {
      min-height: 46px; border: 2px solid var(--navy-800); background: #fff; color: var(--navy-800); border-radius: 12px;
      padding: 10px 18px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .feedback { border-radius: 12px; padding: 12px 14px; margin-top: 14px; font-size: 15px; }
    .feedback.ok { background: var(--green-100); color: #0f5236; }
    .feedback.no { background: var(--red-100); color: #7a1c14; }
    .feedback strong { display: block; margin-bottom: 2px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .result { text-align: center; padding: 10px 0; }
    .result .big-score { font-size: 42px; font-weight: 800; margin: 6px 0; }
    .saved { font-size: 13px; color: var(--ink-600); }
    .say { font-size: 22px; font-weight: 600; line-height: 1.4; margin: 6px 0 16px; overflow-wrap: anywhere; }
    .say .hit { color: var(--green-700); }
    .say .miss { color: #b3261e; text-decoration: underline wavy; }
    .heard { font-size: 14px; color: var(--ink-600); margin-top: 10px; }
    .mic.listening { background: var(--red-600); }
    .note { font-size: 13px; color: var(--ink-600); background: var(--navy-50); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }

    /* V19: AI Speaking Coach */
    .coach-card { background: linear-gradient(135deg, #0b3b78, #1d5fb3); color: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .coach-card h3 { margin: 0 0 6px; font-size: 18px; }
    .coach-card p { margin: 0 0 10px; font-size: 14px; opacity: .95; }
    .coach-card .meta { color: #dbe7f7; }
    .coach-card select { margin-bottom: 10px; }
    .coach-card .primary { background: #fff; color: var(--navy-800); width: 100%; }
    .coach-badge { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; background: var(--red-600); color: #fff; border-radius: 99px; padding: 2px 8px; vertical-align: middle; margin-left: 4px; }
    .coach-list { margin: 0 0 10px; padding-left: 18px; font-size: 14px; display: grid; gap: 2px; }
    .coach-card .coach-price { font-size: 20px; font-weight: 800; margin: 4px 0 10px; }
    .coach-price span { font-size: 14px; font-weight: 500; opacity: .85; }
    .coach-actions { display: grid; gap: 8px; }
    .coach-sent { background: rgba(255,255,255,.15); border-radius: 10px; padding: 10px 12px; margin: 0; font-size: 14px; }
    .chat { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
    .bubble { max-width: 86%; padding: 10px 12px; border-radius: 14px; font-size: 16px; line-height: 1.4; overflow-wrap: anywhere; }
    .bubble.c { align-self: flex-start; background: var(--navy-50); border: 1px solid var(--ink-200); }
    .bubble.s { align-self: flex-end; background: var(--navy-800); color: #fff; }
    .bubble .fix { display: block; margin-top: 6px; font-size: 14px; background: var(--amber-100); color: #5c3606; border-radius: 8px; padding: 6px 8px; }
    .bubble .replay { background: none; border: 0; font-size: 16px; cursor: pointer; padding: 0 0 0 6px; }
    .bubble.thinking { color: var(--ink-600); font-style: italic; }
    .chat-controls { display: grid; gap: 8px; }
    .chat-controls form { display: flex; gap: 8px; }
    .chat-controls input { flex: 1; }

    footer { text-align: center; font-size: 12px; color: var(--ink-600); padding: 0 16px 28px; }
    footer a { color: var(--navy-800); }

    /* V24 Student Portal login */
    .login-card { background: var(--card); border: 1px solid var(--ink-200); border-radius: 16px; padding: 22px 18px; display: grid; gap: 12px; }
    .login-card h2 { margin: 0; font-size: 20px; text-transform: none; letter-spacing: 0; color: var(--ink-900); }
    .login-card p { margin: 0; color: var(--ink-600); font-size: 15px; line-height: 1.45; }
    .login-card label { font-weight: 700; font-size: 14px; }
    .code-input { width: 100%; box-sizing: border-box; font: inherit; font-size: 24px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; text-align: center; padding: 12px; border: 2px solid var(--ink-200); border-radius: 12px; }
    .code-input:focus { outline: none; border-color: var(--navy-800); }
    .login-card .primary { width: 100%; min-height: 50px; font-size: 17px; }
    .login-msg { min-height: 1.2em; color: #b3261e; font-weight: 600; font-size: 14px; }
    .login-tips { font-size: 14px; color: var(--ink-600); background: var(--navy-50); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }

    /* ===== Poster look + game feel (27 Sept). Visual only. ===== */
    :root {
      --ink: #0f1b3d; --pill: #16275c; --sky: #3fb3f0; --sky-tile: #dcefff; --sky-soft: #eef7ff;
      --sun: #ffd23f; --butter: #fff1a8; --butter-soft: #fff8d6; --blush: #ffe1e1; --mint: #dff5e9; --red: #ea2a2a;
      --navy-950: #0f1b3d; --navy-800: #16275c; --navy-100: #dcefff; --navy-50: #f6fbff;
      --red-600: #ea2a2a; --ink-900: #0f1b3d; --ink-200: #dfe9f5; --page: #f6fbff;
      --display: "Poppins", "Nunito", ui-sans-serif, system-ui, sans-serif;
      --hand: "Patrick Hand", "Comic Sans MS", "Segoe Print", cursive;
    }
    body {
      font-family: "Nunito", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 300px 220px at 100% 0%, rgba(255, 210, 63, .6), transparent 70%),
        radial-gradient(ellipse 280px 240px at 0% 0%, rgba(63, 179, 240, .22), transparent 70%),
        radial-gradient(ellipse 320px 260px at 0% 100%, rgba(63, 179, 240, .25), transparent 70%),
        #f6fbff fixed;
    }
    header { background: transparent; color: var(--ink); padding-bottom: 30px; }
    .brand img { box-shadow: 0 6px 16px rgba(15, 27, 61, .12); }
    .brand strong { font-family: var(--display); font-weight: 900; color: var(--ink); }
    .brand span { font-family: var(--hand); font-style: normal; font-size: 16px; color: #1d4ed8; opacity: 1; }
    header h1 {
      font-family: var(--display); font-size: 34px; font-weight: 900; letter-spacing: -.03em; color: var(--ink);
      display: inline-block; background: linear-gradient(transparent 68%, rgba(255, 210, 63, .8) 68% 90%, transparent 90%);
    }
    .sub { color: #34405f; opacity: 1; font-weight: 700; }
    .progress-card { border: 3px solid var(--sun); border-radius: 26px; box-shadow: 0 16px 36px rgba(15, 27, 61, .10); margin-top: 0; }
    .progress-top strong { font-family: var(--display); color: var(--ink); font-weight: 800; }
    .progress-top span { background: var(--sky-tile); color: var(--ink); font-family: var(--display); font-weight: 900; border-radius: 99px; padding: 2px 12px; }
    .bar { height: 16px; background: var(--sky-tile); }
    .bar div {
      background: repeating-linear-gradient(45deg, rgba(255,255,255,.28) 0 8px, transparent 8px 16px), linear-gradient(90deg, var(--sky), var(--pill));
      background-size: 32px 100%, 100% 100%;
      animation: llsStripes 1.2s linear infinite;
    }
    @keyframes llsStripes { to { background-position: 32px 0, 0 0; } }
    h2 { font-family: var(--display); color: var(--ink); font-weight: 800; letter-spacing: .06em; }
    .item, .course { border-radius: 22px; border: 0; background: #ffffff; box-shadow: 0 6px 18px rgba(15, 27, 61, .07); }
    .item:nth-of-type(3n+1) { background: var(--sky-soft); }
    .item:nth-of-type(3n+2) { background: var(--butter-soft); }
    .item:nth-of-type(3n) { background: #fff3f3; }
    .item.done { background: var(--mint); }
    .title { font-family: var(--display); font-weight: 800; }
    .tick { border-radius: 999px; border-color: var(--pill); color: var(--pill); font-family: var(--display); transition: transform .16s cubic-bezier(.34,1.56,.64,1); }
    .tick:active { transform: scale(.94); }
    .tick.is-done { background: #18a86b; border-color: #18a86b; color: #fff; box-shadow: 0 8px 18px rgba(24, 168, 107, .3); }
    .tab { border-radius: 999px; border-color: var(--pill); color: var(--pill); font-family: var(--display); }
    .tab[aria-selected="true"] { background: var(--pill); color: #fff; box-shadow: 0 10px 20px rgba(22, 39, 92, .25); }
    .set { border-radius: 999px; background: var(--sky-soft); border-color: var(--sky-tile); }
    .set.passed::before { content: "⭐ "; }
    .now { background: var(--sun); color: var(--ink); }
    .due.soon { background: var(--butter); color: #7a5200; }
    .due.ok { background: var(--sky-tile); color: var(--ink); }
    .lls-burst { position: fixed; pointer-events: none; z-index: 999; font-size: 22px; animation: llsBurst .9s ease-out forwards; }
    @keyframes llsBurst { from { transform: translate(0, 0) scale(.6); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(var(--rot)); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .bar div { animation: none; } .lls-burst { display: none; } }

    /* road map */
    .journey { background: #fff; border-radius: 26px; padding: 16px; margin: 16px 0 6px; box-shadow: 0 10px 26px rgba(15, 27, 61, .08); border: 2px solid var(--sky-tile); }
    .journey h2 { margin: 0; letter-spacing: 0; text-transform: none; font-size: 17px; }
    .j-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .j-level { background: var(--pill); color: #fff; font-family: var(--display); font-weight: 800; font-size: 13px; border-radius: 99px; padding: 4px 12px; white-space: nowrap; }
    .j-stars { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin: 12px 0 4px; font-size: 14px; }
    .j-stars span { font-family: var(--display); font-weight: 800; }
    .j-stars small { color: #56617a; font-size: 12px; }
    .j-bar { height: 10px; background: var(--butter-soft); border-radius: 99px; overflow: hidden; border: 1px solid #f5e39a; }
    .j-bar i { display: block; height: 100%; background: var(--sun); border-radius: 99px; }
    .j-book { margin: 16px 0 6px; font-size: 12px; font-weight: 800; color: #56617a; text-transform: uppercase; letter-spacing: .06em; }
    .trail { display: flex; align-items: center; overflow-x: auto; padding: 8px 40px 30px 34px; scrollbar-width: thin; }
    .t-node { position: relative; flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 15px; background: var(--sky-soft); color: #7b8aa8; border: 2px dashed var(--sky-tile); }
    .t-node.done { background: var(--mint); color: #18a86b; border: 2px solid #18a86b; font-size: 18px; }
    .t-node.now { background: var(--sun); color: var(--ink); border: 3px solid var(--pill); width: 48px; height: 48px; animation: llsPulse 1.6s ease-in-out infinite; }
    .t-node em { position: absolute; top: 54px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-style: normal; font-size: 11px; font-weight: 800; color: var(--pill); }
    .t-link { flex: none; width: 22px; height: 4px; border-radius: 4px; background: repeating-linear-gradient(90deg, var(--sky-tile) 0 5px, transparent 5px 9px); }
    .t-link.done { background: #18a86b; }
    .t-flag { position: relative; flex: none; margin: 0 14px; width: 38px; height: 38px; border-radius: 12px 12px 12px 3px; border: 0; display: grid; place-items: center; font-size: 18px; cursor: pointer; background: var(--butter); transform: rotate(-6deg); }
    .t-flag.won { background: var(--sun); box-shadow: 0 6px 14px rgba(255, 210, 63, .5); }
    .t-flag.open { background: var(--blush); animation: llsWiggle 2.4s ease-in-out infinite; }
    .t-flag.locked { background: #eef1f6; filter: grayscale(1); opacity: .7; }
    .t-flag em { position: absolute; top: 44px; left: 50%; transform: translateX(-50%) rotate(6deg); white-space: nowrap; font-style: normal; font-size: 10px; font-weight: 800; color: #56617a; }
    .path { list-style: none; margin: 6px 0 0; padding: 0 0 0 4px; display: grid; gap: 0; }
    .step { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; position: relative; padding-bottom: 12px; }
    .step::before { content: ""; position: absolute; left: 16px; top: 32px; bottom: 0; width: 3px; background: repeating-linear-gradient(180deg, var(--sky-tile) 0 5px, transparent 5px 9px); }
    .step:last-child::before { display: none; }
    .step .dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--sky-soft); font-size: 16px; }
    .step.special .dot { background: var(--butter); }
    .step.done .dot, .step.lesson .dot { background: var(--mint); }
    .step.missed .dot { background: #eef1f6; }
    .step.missed strong { color: #7b8aa8; }
    .step strong { display: block; font-size: 14px; font-family: var(--display); font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
    .step small { display: block; color: #56617a; font-size: 12px; overflow-wrap: anywhere; }
    .step.next .dot { background: var(--pill); color: #fff; box-shadow: 0 0 0 4px var(--sun); }
    .step.next strong::after { content: "  ← Next · Prossimo"; color: var(--red); font-size: 11px; font-weight: 800; }
    .step.goal strong::after { content: ""; }
    .path .more button { background: none; border: 0; color: var(--pill); font: inherit; font-weight: 800; font-size: 13px; padding: 0 0 10px 44px; cursor: pointer; text-decoration: underline; }
    @keyframes llsPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 210, 63, .7); } 50% { box-shadow: 0 0 0 8px rgba(255, 210, 63, 0); } }
    @keyframes llsWiggle { 0%, 90%, 100% { transform: rotate(-6deg); } 94% { transform: rotate(6deg); } 97% { transform: rotate(-10deg); } }
    @media (prefers-reduced-motion: reduce) { .t-node.now, .t-flag.open { animation: none; } }

    /* road map v2 (28 Sept): winding road + at a glance + goals + weeks */
    .road-wrap { margin: 14px -6px 4px; background: linear-gradient(180deg, var(--sky-soft), #fff); border-radius: 22px; padding: 6px 2px 2px; }
    .road-wrap .j-book { margin: 8px 14px 0; }
    .road-svg { display: block; width: 100%; height: auto; }
    .road-svg text { font-family: var(--display); }
    .glance { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 14px 0 4px; }
    .g-tile { border-radius: 16px; padding: 10px 8px; text-align: center; background: var(--sky-soft); }
    .g-tile:nth-child(3n+2) { background: var(--butter-soft); }
    .g-tile:nth-child(3n) { background: var(--mint); }
    .g-tile b { display: block; font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.1; color: var(--ink); font-variant-numeric: tabular-nums; }
    .g-tile span { display: block; font-size: 11px; font-weight: 700; color: #56617a; line-height: 1.25; margin-top: 2px; }
    .j-sub { margin: 16px 0 8px; font-family: var(--display); font-weight: 800; font-size: 14px; color: var(--ink); }
    .goals { display: flex; flex-wrap: wrap; gap: 6px; }
    .goal-b { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 800; background: var(--sun); color: var(--ink); }
    .goal-b.todo { background: #eef1f6; color: #7b8aa8; }
    .goal-next { margin-top: 10px; background: var(--butter-soft); border: 1px solid #f5e39a; border-radius: 14px; padding: 10px 12px; font-size: 13px; }
    .goal-next strong { font-family: var(--display); }
    .goal-next .j-bar { margin-top: 6px; }
    .weeks { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; align-items: end; height: 96px; padding: 0 2px; border-bottom: 1px solid var(--ink-200); }
    .wk { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
    .wk i { display: block; width: 100%; max-width: 22px; border-radius: 4px 4px 0 0; background: var(--sky); min-height: 2px; }
    .wk.wk-now i { background: var(--pill); }
    .wk em { font-style: normal; font-size: 11px; font-weight: 800; color: var(--ink); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
    .wk-lab { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; font-size: 10px; color: #56617a; text-align: center; margin-top: 4px; }
    .rates { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; font-size: 12px; font-weight: 700; color: #56617a; }
    .rates span { background: #f3f6fb; border-radius: 999px; padding: 4px 10px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand">
        <img src="logo.png" alt="">
        <div>
          <strong>London Language School</strong>
          <span>We make English fun!</span>
        </div>
      </div>
      <h1 id="hello">My homework</h1>
      <p class="sub" id="subtitle">I compiti di inglese</p>
    </div>
  </header>

  <div class="wrap" style="padding: 0 16px;">
    <section class="progress-card" id="progressCard" hidden>
      <div class="progress-top">
        <strong>Progress · Progressi</strong>
        <span id="progressText"></span>
      </div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progressBar"><div></div></div>
      <div class="split" id="progressSplit"></div>
      <div class="classes" id="classList"></div>
    </section>
    <nav class="tabs" id="tabs" role="tablist" hidden>
      <button class="tab" type="button" role="tab" id="tabHomework" aria-selected="true">📝 Homework · Compiti</button>
      <button class="tab" type="button" role="tab" id="tabPractice" aria-selected="false">🎯 Practice · Esercizi</button>
    </nav>
  </div>

  <main class="wrap" id="main">
    <div class="empty">Loading your homework… · Caricamento…</div>
  </main>

  <footer>Questions? Ask your teacher or the school office. <span id="switchWrap" hidden>· <a href="#" id="switchStudent">Non sei tu? Cambia studente · Switch student</a></span></footer>

  <script src="practice/courses.js"></script>
  <script>
    "use strict";

    const API_URL = "https://script.google.com/macros/s/AKfycbyHbfFoaiMOT1rpY2DcbXAkuNwMoOHVdLlG2aQLgPgCe5gqPuyk8VYm7i4eGQRm8iqi/exec";
    // Remember this student's key on the phone, so the home-screen icon
    // still works if the phone opens it without the ?k= part.
    const STORE = "lls_homework_key";
    let KEY = new URLSearchParams(location.search).get("k") || "";
    try {
      if (KEY) localStorage.setItem(STORE, KEY);
      else KEY = localStorage.getItem(STORE) || "";
    } catch (_) {}
    let data = null;

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // 27 Sept: Google sometimes loses the reply. Reading, logging in and
    // ticking homework are safe to repeat, so retry those up to 3 times.
    const SAFE_TO_RESEND = ["studentCodeLogin", "studentMarkHomework", "studentRequestCoach"];
    async function api(params) {
      let inner = "";
      try { inner = params.action === "mutate" ? JSON.parse(params.payload || "{}").action : ""; } catch (_) {}
      const safe = params.action !== "mutate" || SAFE_TO_RESEND.indexOf(inner) !== -1;
      let result = null, problem = "";
      for (let attempt = 0; attempt < (safe ? 3 : 1); attempt++) {
        if (attempt) await new Promise((r) => setTimeout(r, attempt * 1200));
        const url = new URL(API_URL);
        Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
        url.searchParams.set("_", Date.now());
        try {
          const response = await fetch(url.toString(), { cache: "no-store", redirect: "follow" });
          if (!response.ok) { problem = "HTTP " + response.status; continue; }
          result = JSON.parse(await response.text());
          break;
        } catch (_) { problem = "no reply"; }
      }
      if (!result) throw new Error("The connection dropped (" + problem + "). Try again · Connessione persa, riprova.");
      if (result.success !== true) throw new Error(result?.error || "Something went wrong.");
      return result;
    }

    function parseDate(text) {
      const raw = String(text || "").trim();
      const m = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
      const uk = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); // sheet shows UK dates
      return uk ? new Date(+uk[3], +uk[2] - 1, +uk[1]) : null;
    }

    function dueBadge(text, isDone) {
      const due = parseDate(text);
      if (!due) return "";
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const days = Math.round((due - today) / 86400000);
      const label = due.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
      if (isDone) return `<span class="due ok">Due ${esc(label)}</span>`;
      if (days < 0) return `<span class="due late">Late · was due ${esc(label)}</span>`;
      if (days === 0) return `<span class="due soon">Due today · Per oggi</span>`;
      if (days === 1) return `<span class="due soon">Due tomorrow · Per domani</span>`;
      return `<span class="due ok">Due ${esc(label)}</span>`;
    }

    const COURSES = window.LLS_COURSES || {};
    const PRACTICE = window.LLS_PRACTICE;
    const TYPE_NAMES = { g: "Grammar", v: "Vocabulary", s: "Speaking", r: "Review", t: "Mini test" };
    const TYPE_IT = { g: "Grammatica", v: "Vocabolario", s: "Pronuncia", r: "Ripasso", t: "Mini test" };
    const BOOK_STORE = "lls_practice_book";
    let tab = location.hash === "#practice" ? "practice" : "homework";
    let banks = {};
    let quiz = null;

    /* ---------- progress (homework 80% + practice 20%) ---------- */

    function homeworkItems() {
      const classById = {};
      data.classes.forEach((c) => { classById[String(c["Class ID"])] = c; });
      const statusById = {};
      data.status.forEach((s) => { statusById[String(s["Homework ID"])] = s["Status"]; });
      return data.homework.map((h) => ({
        ...h,
        done: statusById[String(h["Homework ID"])] === "Done",
        className: classById[String(h["Class ID"])]?.["Class Name"] || ""
      }));
    }

    // The class books this student practises with (deduplicated).
    function myBooks() {
      const seen = {};
      const list = [];
      data.classes.forEach((c) => {
        const id = String(c["Book"] || "").trim();
        if (!COURSES[id] || !COURSES[id].lessons.length) return;
        const units = String(c["Units"] || "").trim();
        const k = id + "|" + units;
        if (seen[k]) return;
        seen[k] = true;
        list.push({ id, units, current: String(c["Current Unit"] || "").trim(), className: c["Class Name"] });
      });
      return list;
    }

    function resultsById() {
      const map = {};
      (data.practice || []).forEach((r) => { map[String(r.setId)] = r; });
      return map;
    }

    function passed(r) {
      return r && Number(r.total) > 0 && Number(r.best) / Number(r.total) >= PRACTICE.PASS_MARK;
    }

    function practiceCounts() {
      if (!PRACTICE) return { done: 0, total: 0 };
      const ids = new Set();
      myBooks().forEach((b) => PRACTICE.practiceSetIdsFor(b.id, b.units, b.current).forEach((id) => ids.add(id)));
      const res = resultsById();
      let done = 0;
      ids.forEach((id) => { if (passed(res[id])) done++; });
      return { done, total: ids.size };
    }

    function renderProgress() {
      const items = homeworkItems();
      const hwDone = items.filter((i) => i.done).length;
      const hwTotal = items.length;
      const tests = data.tests || [];
      const testsDone = tests.filter((t) => testResultFor(t.testId)).length;
      // Everything set counts equally: homework, tests, reviews, mini tests = 1 point;
      // each lesson practice set = 1/3.
      const p = PRACTICE
        ? PRACTICE.progressPoints({
            homeworkDone: hwDone, homeworkTotal: hwTotal,
            testsDone, testsTotal: tests.length,
            results: data.practice || [],
            books: myBooks(),
            ratings: (data.attendance || []).map((a) => a.rating).filter(Boolean)
          })
        : { pct: hwTotal ? Math.round((hwDone / hwTotal) * 100) : 0, available: hwTotal, homework: [hwDone, hwTotal], tests: [0, 0], practice: [0, 0] };
      const pct = p.pct;

      document.getElementById("progressCard").hidden = false;
      document.getElementById("progressText").textContent = p.available ? `${pct}%` : "Let's start! · Iniziamo!";
      const bar = document.getElementById("progressBar");
      bar.setAttribute("aria-valuenow", String(pct));
      bar.firstElementChild.style.width = pct + "%";

      const parts = [];
      parts.push(hwTotal ? `Homework ${hwDone}/${hwTotal}` : "No homework yet");
      if (p.tests[1]) parts.push(`Tests ${p.tests[0]}/${p.tests[1]}`);
      if (p.practice[1]) parts.push(`Practice ${Math.round((p.practice[0] / p.practice[1]) * 100)}%`);
      if (p.lessons && p.lessons[1]) parts.push(`In class ${Math.round((p.lessons[0] / p.lessons[1]) * 100)}%`);
      document.getElementById("progressSplit").textContent = parts.join(" · ");
      document.getElementById("classList").textContent = data.classes.length
        ? "Class: " + data.classes.map((c) => c["Class Name"]).join(", ")
        : "";
    }

    function render() {
      const name = data.student.firstName;
      document.getElementById("hello").textContent = name ? `Hi ${name}!` : "My English";
      document.getElementById("subtitle").textContent = "Homework and practice · Compiti ed esercizi";
      renderProgress();

      const tabs = document.getElementById("tabs");
      tabs.hidden = false;
      document.getElementById("tabHomework").setAttribute("aria-selected", String(tab === "homework"));
      document.getElementById("tabPractice").setAttribute("aria-selected", String(tab === "practice"));

      if (quiz) renderQuiz();
      else if (chat) renderChat();
      else if (tab === "practice") renderPractice();
      else renderHomework();
    }

    function setTab(next) {
      tab = next;
      quiz = null;
      if (chat) endChat();
      try { history.replaceState(null, "", next === "practice" ? "#practice" : location.pathname + location.search); } catch (_) {}
      render();
    }
    document.getElementById("tabHomework").addEventListener("click", () => setTab("homework"));
    document.getElementById("tabPractice").addEventListener("click", () => setTab("practice"));


    /* ---------- road map: "My journey" (27 Sept) ----------
       Visual companion to the progress numbers. Uses what the app already
       has (homework, tests, practice, class unit); with Apps Script V25 it
       also shows each lesson (date, unit or special lesson, attendance). */

    let journeyOpen = false;

    function isoDay(text) {
      const d = parseDate(text);
      if (!d || isNaN(d)) return "";
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
    function shortDay(iso) {
      if (!iso) return "";
      return new Date(iso + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    }

    function journeyStars() {
      const res = resultsById();
      let practice = 0, checkpoints = 0;
      Object.keys(res).forEach((id) => {
        if (/-(R|T)\d+$/.test(id)) { if (/-T\d+$/.test(id) || passed(res[id])) checkpoints++; }
        else if (passed(res[id])) practice++;
      });
      const hw = homeworkItems().filter((i) => i.done).length;
      const tests = (data.tests || []).filter((t) => testResultFor(t.testId)).length;
      const lessons = (data.attendance || []).filter((a) => a.status === "Present" || a.status === "Late").length;
      const excellent = (data.attendance || []).filter((a) => a.rating === "Excellent").length;
      return hw + tests + practice + checkpoints * 3 + lessons + excellent;
    }

    function trailHtml(book) {
      const course = COURSES[book.id];
      if (!course) return "";
      const range = PRACTICE.parseUnits(book.id, book.units);
      const cur = Number(book.current) || 0;
      const res = resultsById();
      let html = "";
      for (let n = range.from; n <= range.to; n++) {
        const state = cur && n < cur ? "done" : n === cur ? "now" : "next";
        html += `<div class="t-node ${state}" title="Unit ${n}"><span>${state === "done" ? "★" : n}</span>${state === "now" ? '<em>You are here · Sei qui</em>' : ""}</div>`;
        const flags = [];
        (course.reviews || []).forEach((b, i) => { if (b[1] === n && b[0] >= range.from) flags.push({ kind: "r", id: `${book.id}-R${i + 1}`, label: "Review" }); });
        (course.tests || []).forEach((b, i) => { if (b[1] === n && b[0] >= range.from && b[1] <= range.to) flags.push({ kind: "t", id: `${book.id}-T${i + 1}`, label: "Test" }); });
        flags.forEach((f) => {
          const r = res[f.id];
          const won = f.kind === "t" ? Boolean(r) : passed(r);
          const open = !cur || cur >= n;
          const st = won ? "won" : open ? "open" : "locked";
          const icon = won ? "⭐" : open ? (f.kind === "t" ? "🏁" : "🔁") : "🔒";
          html += `<button type="button" class="t-flag ${st}" data-journey-practice title="${esc(f.kind === "t" ? "Mini test" : "Review")}"><span>${icon}</span><em>${esc(f.label)}</em></button>`;
        });
        if (n < range.to) html += `<i class="t-link ${cur && n < cur ? "done" : ""}"></i>`;
      }
      return `<p class="j-book">${esc(course.title || book.id)} · ${esc(book.className || "")}</p><div class="trail" role="list">${html}</div>`;
    }

    function journeySteps() {
      const classById = {};
      data.classes.forEach((c) => { classById[String(c["Class ID"])] = c; });
      const att = {};
      const rate = {};
      (data.attendance || []).forEach((a) => { att[a.classId + "|" + a.lessonDate] = a.status; rate[a.classId + "|" + a.lessonDate] = a.rating || ""; });
      const RATE_LABEL = { Excellent: "⭐ Excellent!", Good: "👍 Good work", OK: "🙂 OK", "Needs support": "🤝 Keep going" };
      const steps = [];
      (data.lessons || []).forEach((l) => {
        const special = (String(l.unit || "").match(/^Special:\s*(.+)$/i) || [])[1];
        const status = att[l.classId + "|" + l.lessonDate] || "";
        const missed = status === "Absent" || status === "Excused";
        steps.push({
          date: l.lessonDate,
          icon: special ? "⭐" : missed ? "💤" : "📘",
          cls: special ? "special" : missed ? "missed" : "lesson",
          title: special ? `Special lesson: ${special}` : (l.unit ? `Lesson · Unit ${l.unit}` : "Lesson · Lezione"),
          sub: (missed ? "Missed · Assente — " : (RATE_LABEL[rate[l.classId + "|" + l.lessonDate]] ? RATE_LABEL[rate[l.classId + "|" + l.lessonDate]] + " — " : "")) + (l.whatWeDid || classById[l.classId]?.["Class Name"] || "")
        });
      });
      homeworkItems().forEach((h) => {
        steps.push({
          date: isoDay(h["Assigned Date"]) || isoDay(h["Due Date"]),
          icon: h.done ? "✅" : "📝",
          cls: h.done ? "hw done" : "hw",
          title: h["Title"],
          sub: h.done ? "Homework done · Compito fatto" : `Homework · due ${shortDay(isoDay(h["Due Date"]))}`
        });
      });
      (data.tests || []).forEach((t) => {
        const r = testResultFor(t.testId);
        steps.push({
          date: isoDay(t.dueDate) || "9999-12-31",
          icon: r ? "🏆" : "🎯",
          cls: r ? "test done" : "test",
          title: t.title,
          sub: r ? `Test · ${r.first}/${r.total}` : "Test · to do · da fare"
        });
      });
      return steps.sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")));
    }

    /* ---------- road map v2 (28 Sept) ----------
       Winding road (book units, or the school year for classes without a
       book), "At a glance" numbers, goals and an 8-week activity chart.
       Only real data: nothing is shown that the school has not recorded. */

    function safeHtml(fn) {
      try { return fn(); } catch (e) { console.warn("road map", e); return ""; }
    }

    function attendedMarks() {
      return (data.attendance || []).filter((a) => a.status === "Present" || a.status === "Late");
    }

    function roadStopsForBook(book) {
      const course = COURSES[book.id];
      const range = PRACTICE.parseUnits(book.id, book.units);
      const cur = Number(book.current) || 0;
      const res = resultsById();
      const stops = [{ kind: "start", label: "START" }];
      for (let n = range.from; n <= range.to; n++) {
        const flags = [];
        (course.reviews || []).forEach((b, i) => { if (b[1] === n && b[0] >= range.from) flags.push({ t: "r", id: `${book.id}-R${i + 1}` }); });
        (course.tests || []).forEach((b, i) => { if (b[1] === n && b[0] >= range.from && b[1] <= range.to) flags.push({ t: "t", id: `${book.id}-T${i + 1}` }); });
        const icons = flags.map((f) => {
          const r = res[f.id];
          const won = f.t === "t" ? Boolean(r) : passed(r);
          return won ? "⭐" : (!cur || cur >= n) ? (f.t === "t" ? "🏁" : "🔁") : "🔒";
        }).join("");
        stops.push({ kind: "stop", label: `Unit ${n}`, mark: String(n), state: cur && n < cur ? "done" : n === cur ? "now" : "next", icons, practice: flags.length > 0 });
      }
      const exam = /exam/i.test(book.className || "");
      stops.push({ kind: "goal", label: exam ? "EXAM 🎓" : "GOAL 🏆", state: cur > range.to ? "done" : "next" });
      return { title: `${(COURSES[book.id] || {}).title || book.id} · ${book.className || ""}`, stops };
    }

    function roadStopsForYear() {
      // Classes without a book: the school year, Sept 2026 → May 2027.
      const months = [["2026-10", "Oct"], ["2026-11", "Nov"], ["2026-12", "Dec"], ["2027-01", "Jan"], ["2027-02", "Feb"], ["2027-03", "Mar"], ["2027-04", "Apr"], ["2027-05", "May"]];
      const nowKey = isoDay(new Date().toISOString().slice(0, 10)).slice(0, 7);
      const perMonth = {};
      attendedMarks().forEach((a) => { const k = String(a.lessonDate || "").slice(0, 7); perMonth[k] = (perMonth[k] || 0) + 1; });
      const stops = [{ kind: "start", label: "START", sub: "28 Sept" }];
      months.forEach(([k, label]) => {
        const state = k < nowKey ? "done" : k === nowKey ? "now" : "next";
        stops.push({ kind: "stop", label, mark: label.slice(0, 1), state, icons: perMonth[k] ? `${perMonth[k]}✓` : "" });
      });
      if (nowKey < "2026-10") stops[0].state = "now";
      stops.push({ kind: "goal", label: "GOAL 🏆", state: nowKey > "2027-05" ? "done" : "next" });
      const name = (data.classes[0] || {})["Class Name"] || "";
      return { title: `School year 2026/27 · Anno scolastico${name ? " · " + name : ""}`, stops };
    }

    function roadSvg(road) {
      const PER = 4, W = 340, TOP = 50, ROW = 96, xs = [52, 132, 212, 292];
      const rows = Math.ceil(road.stops.length / PER);
      const H = TOP + (rows - 1) * ROW + 58;
      const pos = road.stops.map((s, i) => {
        const r = Math.floor(i / PER), c = i % PER;
        return { x: r % 2 ? xs[PER - 1 - c] : xs[c], y: TOP + r * ROW };
      });
      // One continuous road: straight rows joined by U-turns at the ends.
      let d = `M ${r0x(0)} ${TOP}`;
      function r0x(r) { return r % 2 ? 318 : 22; }
      for (let r = 0; r < rows; r++) {
        const y = TOP + r * ROW;
        const endX = r % 2 ? 22 : 318;
        const lastRow = r === rows - 1;
        if (lastRow) {
          const lastIdx = road.stops.length - 1;
          d += ` L ${pos[lastIdx].x + (r % 2 ? -26 : 26)} ${y}`;
        } else {
          d += ` L ${endX} ${y} A 20 ${ROW / 2} 0 0 ${r % 2 ? 0 : 1} ${endX} ${y + ROW}`;
        }
      }
      const nowIdx = road.stops.findIndex((s) => s.state === "now");
      const parts = road.stops.map((s, i) => {
        const { x, y } = pos[i];
        if (s.kind === "start" || s.kind === "goal") {
          const w = s.kind === "goal" ? 74 : 58;
          const fill = s.kind === "goal" ? (s.state === "done" ? "#18a86b" : "#ea2a2a") : "#16275c";
          return `<g><rect x="${x - w / 2}" y="${y - 15}" width="${w}" height="30" rx="9" fill="${fill}"/>` +
            `<path d="M ${x - 5} ${y + 15} L ${x} ${y + 22} L ${x + 5} ${y + 15} Z" fill="${fill}"/>` +
            `<text x="${x}" y="${y + 5}" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">${esc(s.label)}</text>` +
            (s.sub ? `<text x="${x}" y="${y + 38}" text-anchor="middle" font-size="10" font-weight="700" fill="#56617a">${esc(s.sub)}</text>` : "") + `</g>`;
        }
        const st = s.state;
        const circle = st === "done"
          ? `<circle cx="${x}" cy="${y}" r="15" fill="#dff5e9" stroke="#18a86b" stroke-width="2.5"/><text x="${x}" y="${y + 5}" text-anchor="middle" font-size="14" font-weight="800" fill="#18a86b">★</text>`
          : st === "now"
            ? `<circle cx="${x}" cy="${y}" r="18" fill="#ffd23f" stroke="#16275c" stroke-width="3"/><text x="${x}" y="${y + 5}" text-anchor="middle" font-size="14" font-weight="800" fill="#0f1b3d">${esc(s.mark)}</text>`
            : `<circle cx="${x}" cy="${y}" r="15" fill="#ffffff" stroke="#9fc4ea" stroke-width="2" stroke-dasharray="4 3"/><text x="${x}" y="${y + 5}" text-anchor="middle" font-size="13" font-weight="800" fill="#7b8aa8">${esc(s.mark)}</text>`;
        const label = `<text x="${x}" y="${y + 34}" text-anchor="middle" font-size="10.5" font-weight="800" fill="${st === "now" ? "#16275c" : "#56617a"}">${esc(s.label)}</text>`;
        const icons = s.icons ? `<text x="${x + 17}" y="${y - 13}" font-size="12" font-weight="800" fill="#18a86b">${esc(s.icons)}</text>` : "";
        const tap = s.practice ? ` data-journey-practice style="cursor:pointer"` : "";
        return `<g${tap}>${circle}${label}${icons}</g>`;
      }).join("");
      const walker = nowIdx >= 0 ? `<g class="walker"><circle cx="${pos[nowIdx].x}" cy="${pos[nowIdx].y - 34}" r="14" fill="#fff" stroke="#ffd23f" stroke-width="3"/><text x="${pos[nowIdx].x}" y="${pos[nowIdx].y - 28}" text-anchor="middle" font-size="16">🧑‍🎓</text></g>` : "";
      const doneCount = road.stops.filter((s) => s.state === "done").length;
      const aria = `Road map: ${doneCount} of ${road.stops.length} stops done` + (nowIdx >= 0 ? `, you are at ${road.stops[nowIdx].label}` : "");
      return `<div class="road-wrap"><p class="j-book">${esc(road.title)}</p>
        <svg class="road-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">
          <path d="${d}" fill="none" stroke="#c9dcf2" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="${d}" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="8 8" stroke-linecap="round"/>
          ${parts}${walker}
        </svg></div>`;
    }

    function roadHtml() {
      const books = myBooks();
      if (books.length && PRACTICE) return books.map((b) => roadSvg(roadStopsForBook(b))).join("");
      if (!data.classes.length) return "";
      return roadSvg(roadStopsForYear());
    }

    function glanceNumbers() {
      const marks = data.attendance || [];
      const attended = attendedMarks();
      const marked = marks.filter((a) => ["Present", "Late", "Absent", "Excused"].includes(a.status)).length;
      const classById = {};
      data.classes.forEach((c) => { classById[String(c["Class ID"])] = c; });
      // Hours only when every attended class has a Duration (Apps Script V26+).
      let minutes = 0, hoursKnown = attended.length > 0;
      attended.forEach((a) => { const m = Number((classById[a.classId] || {})["Duration"]); if (m > 0) minutes += m; else hoursKnown = false; });
      const attendedKey = new Set(attended.map((a) => a.classId + "|" + a.lessonDate));
      const topics = new Set();
      (data.lessons || []).forEach((l) => {
        if (!attendedKey.has(l.classId + "|" + l.lessonDate)) return;
        const special = (String(l.unit || "").match(/^Special:\s*(.+)$/i) || [])[1];
        const unit = (String(l.unit || "").match(/\d{1,2}\s*[A-D]?/i) || [""])[0].replace(/\s+/g, "").toUpperCase();
        const key = special ? "S:" + special.toLowerCase() : unit ? "U:" + unit : String(l.whatWeDid || "").trim().toLowerCase().slice(0, 40);
        if (key) topics.add(key);
      });
      const items = homeworkItems();
      const res = resultsById();
      const practicePassed = Object.keys(res).filter((id) => passed(res[id])).length;
      const testsDone = (data.tests || []).filter((t) => testResultFor(t.testId)).length;
      const excellent = marks.filter((a) => a.rating === "Excellent").length;
      return { attended: attended.length, marked, hoursKnown, hours: minutes / 60, topics: topics.size,
        hwDone: items.filter((i) => i.done).length, hwTotal: items.length, practicePassed, testsDone, excellent };
    }

    function glanceHtml() {
      const n = glanceNumbers();
      const pct = n.marked ? Math.round((n.attended / n.marked) * 100) : null;
      const hrs = Math.round(n.hours * 10) / 10;
      const tiles = [
        [n.attended, "Lessons · Lezioni"],
        n.hoursKnown ? [String(hrs).replace(".", ","), "Hours in class · Ore"] : [pct === null ? "–" : pct + "%", "Attendance · Presenze"],
        [n.topics, "Topics covered · Argomenti"],
        [`${n.hwDone}/${n.hwTotal}`, "Homework · Compiti"],
        myBooks().length ? [n.practicePassed, "Practice sets · Esercizi"] : [n.excellent, "⭐ Excellent"],
        [n.testsDone, "Tests · Verifiche"]
      ];
      return `<p class="j-sub">📊 At a glance · In breve</p><div class="glance">${tiles.map(([v, l]) => `<div class="g-tile"><b>${esc(String(v))}</b><span>${esc(l)}</span></div>`).join("")}</div>`;
    }

    function goalsHtml() {
      const n = glanceNumbers();
      const goals = [
        ["🎒", "First lesson", n.attended, 1], ["🔥", "5 lessons", n.attended, 5], ["🚀", "20 lessons", n.attended, 20], ["🏅", "50 lessons", n.attended, 50],
        ["📝", "First homework", n.hwDone, 1], ["📚", "10 homework", n.hwDone, 10],
        ["🎯", "First practice set", n.practicePassed, 1], ["💪", "10 practice sets", n.practicePassed, 10],
        ["💯", "First Excellent", n.excellent, 1], ["🏆", "First test", n.testsDone, 1]
      ];
      const won = goals.filter((g) => g[2] >= g[3]);
      const open = goals.filter((g) => g[2] < g[3]).sort((a, b) => (b[2] / b[3]) - (a[2] / a[3]));
      const next = open[0];
      return `<p class="j-sub">🏁 Goals · Obiettivi (${won.length}/${goals.length})</p>
        <div class="goals">${won.map((g) => `<span class="goal-b">${g[0]} ${esc(g[1])}</span>`).join("")}${open.slice(1, 4).map((g) => `<span class="goal-b todo">🔒 ${esc(g[1])}</span>`).join("")}</div>
        ${next ? `<div class="goal-next">Next goal · Prossimo obiettivo: <strong>${next[0]} ${esc(next[1])}</strong> — ${next[2]}/${next[3]}
          <div class="j-bar"><i style="width:${Math.round((next[2] / next[3]) * 100)}%"></i></div></div>` : `<div class="goal-next"><strong>🎉 Every goal reached! · Tutti gli obiettivi raggiunti!</strong></div>`}`;
    }

    function weeksHtml() {
      const monday = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
      const start = monday(new Date());
      const weeks = [];
      const courseStart = new Date(2026, 8, 28);
      for (let i = 7; i >= 0; i--) { const w = new Date(start); w.setDate(w.getDate() - i * 7); if (w >= courseStart || i === 0) weeks.push({ from: w, lessons: 0, hw: 0, practice: 0 }); }
      const bucket = (text) => {
        const d = parseDate(text);
        if (!d) return null;
        const m = monday(d).getTime();
        return weeks.find((w) => w.from.getTime() === m) || null;
      };
      attendedMarks().forEach((a) => { const w = bucket(a.lessonDate); if (w) w.lessons++; });
      (data.status || []).forEach((s) => { if (s["Status"] === "Done") { const w = bucket(s["Completed Date"]); if (w) w.hw++; } });
      (data.practice || []).forEach((p) => { const w = bucket(p.date); if (w) w.practice++; });
      (data.testResults || []).forEach((t) => { const w = bucket(t.date); if (w) w.practice++; });
      const totals = weeks.map((w) => w.lessons + w.hw + w.practice);
      const max = Math.max(1, ...totals);
      if (!totals.some(Boolean)) return "";
      const bars = weeks.map((w, i) => {
        const t = totals[i];
        const tip = `Week of ${w.from.toLocaleDateString("en-GB", { day: "numeric", month: "short" })}: ${w.lessons} lessons, ${w.hw} homework, ${w.practice} practice/tests`;
        return `<div class="wk ${i === weeks.length - 1 ? "wk-now" : ""}" title="${esc(tip)}" aria-label="${esc(tip)}">${t ? `<em>${t}</em>` : ""}<i style="height:${Math.round((t / max) * 72)}px"></i></div>`;
      }).join("");
      const labels = weeks.map((w, i) => `<span>${i === weeks.length - 1 ? "This wk" : w.from.toLocaleDateString("en-GB", { day: "numeric", month: "short" })}</span>`).join("");
      const r = { Excellent: 0, Good: 0, OK: 0, "Needs support": 0 };
      (data.attendance || []).forEach((a) => { if (a.rating in r) r[a.rating]++; });
      const rates = Object.values(r).some(Boolean) ? `<div class="rates">${[["⭐", "Excellent"], ["👍", "Good"], ["🙂", "OK"], ["🤝", "Needs support"]].filter(([, k]) => r[k]).map(([i, k]) => `<span>${i} ${k} × ${r[k]}</span>`).join("")}</div>` : "";
      return `<p class="j-sub">📈 My weeks · Le mie settimane <small style="font-weight:600;color:#56617a;font-size:11px">(lessons + homework + practice)</small></p>
        <div class="weeks" style="grid-template-columns:repeat(${weeks.length},minmax(0,1fr))">${bars}</div><div class="wk-lab" style="grid-template-columns:repeat(${weeks.length},minmax(0,1fr))">${labels}</div>${rates}`;
    }

    function journeyHtml() {
      const stars = journeyStars();
      const level = Math.floor(stars / 10) + 1;
      const inLevel = stars % 10;
      const books = myBooks();
      const steps = journeySteps();
      const todayIso = isoDay(new Date().toISOString().slice(0, 10));
      const past = steps.filter((s) => s.date && s.date <= todayIso && !(s.cls === "hw" || s.cls === "test"));
      const open = steps.filter((s) => s.cls === "hw" || s.cls === "test");
      const shown = journeyOpen ? past : past.slice(-5);
      const stepHtml = (s, extra) => `<li class="step ${s.cls} ${extra || ""}"><span class="dot">${s.icon}</span><div><strong>${esc(s.title)}</strong><small>${s.date && s.date < "9999" ? esc(shortDay(s.date)) + " · " : ""}${esc(s.sub)}</small></div></li>`;
      const nextStep = open[0];
      if (!books.length && !steps.length && !data.classes.length) return "";
      return `
        <section class="journey" aria-label="My journey">
          <div class="j-head">
            <h2>🗺️ My journey · Il mio percorso</h2>
            <span class="j-level">Level ${level}</span>
          </div>
          <div class="j-stars"><span>⭐ ${stars} ${stars === 1 ? "star" : "stars"}</span><div class="j-bar"><i style="width:${inLevel * 10}%"></i></div><small>${10 - inLevel} to Level ${level + 1}</small></div>
          ${safeHtml(roadHtml)}
          ${safeHtml(glanceHtml)}
          ${safeHtml(goalsHtml)}
          ${safeHtml(weeksHtml)}
          ${shown.length || nextStep ? `<p class="j-sub">📘 What we did · Cosa abbiamo fatto</p><ol class="path">
            ${past.length > shown.length ? `<li class="more"><button type="button" data-journey-all>Show all ${past.length} · Vedi tutto</button></li>` : ""}
            ${shown.map((s) => stepHtml(s)).join("")}
            ${nextStep ? stepHtml(nextStep, "next") : `<li class="step next goal"><span class="dot">🎉</span><div><strong>All caught up! · Tutto in pari!</strong><small>Try a practice set to earn more stars.</small></div></li>`}
          </ol>` : ""}
        </section>`;
    }

    function bindJourney(main) {
      main.querySelectorAll("[data-journey-practice]").forEach((b) => b.addEventListener("click", () => setTab("practice")));
      main.querySelectorAll("[data-journey-all]").forEach((b) => b.addEventListener("click", () => { journeyOpen = true; renderHomework(); }));
    }

    /* ---------- homework ---------- */

    function testsHtml() {
      const tests = (data.tests || []).slice().sort((a, b) => String(a.dueDate || "9999").localeCompare(String(b.dueDate || "9999")));
      if (!tests.length) return "";
      const classById = {};
      data.classes.forEach((c) => { classById[String(c["Class ID"])] = c; });
      return `<h2>Tests · Verifiche (${tests.length})</h2>` + tests.map((t) => {
        const r = testResultFor(t.testId);
        return `
          <article class="item ${r ? "done" : ""}">
            <div>
              <p class="title" style="text-decoration:none">📝 ${esc(t.title)}</p>
              <p class="meta">${esc(classById[t.classId]?.["Class Name"] || "")} · ${t.count} questions · domande</p>
              ${r ? `<span class="due ok">Your score · Punteggio: ${r.first}/${r.total}</span>` : dueBadge(t.dueDate, false)}
            </div>
            <button class="tick ${r ? "is-done" : ""}" type="button" data-test="${esc(t.testId)}">${r ? "Try again" : "Start · Inizia"}</button>
          </article>`;
      }).join("");
    }

    function renderHomework() {
      const main = document.getElementById("main");
      const items = homeworkItems();

      if (!items.length) {
        main.innerHTML = journeyHtml() + testsHtml() + `<div class="empty" style="margin-top:18px">No homework yet. 🎉<br>Nessun compito per ora.<br><br>Why not try some practice? · Prova gli esercizi!</div>`;
        main.querySelectorAll("[data-test]").forEach((b) => b.addEventListener("click", () => startTeacherTest(b.dataset.test)));
        bindJourney(main);
        return;
      }

      const byDue = (a, b) => String(a["Due Date"] || "9999").localeCompare(String(b["Due Date"] || "9999"));
      const todo = items.filter((i) => !i.done).sort(byDue);
      const finished = items.filter((i) => i.done).sort(byDue).reverse();

      const card_ = (i) => `
        <article class="item ${i.done ? "done" : ""}">
          <div>
            <p class="title">${esc(i["Title"])}</p>
            ${i.className ? `<p class="meta">${esc(i.className)}</p>` : ""}
            ${dueBadge(i["Due Date"], i.done)}
          </div>
          <button class="tick ${i.done ? "is-done" : ""}" type="button"
                  data-id="${esc(i["Homework ID"])}" data-next="${i.done ? "Not started" : "Done"}"
                  aria-pressed="${i.done}">
            ${i.done ? "Done ✓" : "Mark done"}
          </button>
          ${i["Description"] ? `<p class="desc">${esc(i["Description"])}</p>` : ""}
        </article>`;

      main.innerHTML = journeyHtml() + testsHtml() +
        `<h2>To do · Da fare (${todo.length})</h2>` +
        (todo.length ? todo.map(card_).join("") : `<div class="empty">All done! Well done. 🎉<br>Tutto fatto, bravo/a!</div>`) +
        (finished.length ? `<h2>Done · Fatti (${finished.length})</h2>` + finished.map(card_).join("") : "");

      main.querySelectorAll(".tick[data-id]").forEach((button) => {
        button.addEventListener("click", () => toggle(button));
      });
      main.querySelectorAll("[data-test]").forEach((b) => b.addEventListener("click", () => startTeacherTest(b.dataset.test)));
      bindJourney(main);
    }

    async function toggle(button) {
      const id = button.dataset.id;
      const next = button.dataset.next;
      button.disabled = true;
      button.textContent = "Saving…";

      try {
        await api({
          action: "mutate",
          payload: JSON.stringify({ action: "studentMarkHomework", key: KEY, homeworkId: id, status: next })
        });
        const existing = data.status.find((s) => String(s["Homework ID"]) === id);
        if (existing) existing["Status"] = next;
        else data.status.push({ "Homework ID": id, "Status": next });
        const rect = button.getBoundingClientRect();
        render();
        if (next === "Done" && window.llsCelebrate) window.llsCelebrate(rect);
      } catch (error) {
        button.disabled = false;
        button.textContent = next === "Done" ? "Mark done" : "Done ✓";
        alert("Could not save. Please try again.\nNon è stato possibile salvare. Riprova.");
      }
    }

    /* ---------- practice: choose a unit ---------- */

    function chosenBook() {
      try { return localStorage.getItem(BOOK_STORE) || ""; } catch (_) { return ""; }
    }

    function renderPractice() {
      const main = document.getElementById("main");
      if (!PRACTICE) {
        main.innerHTML = `<div class="error">Practice could not load. Please refresh the page.</div>`;
        return;
      }

      const books = myBooks();
      const extra = chosenBook();
      let html = "";

      if (!books.length) {
        html += `<div class="note" style="margin-top:18px">Your teacher hasn't chosen your practice book yet. Choose one below. ·
          Il tuo insegnante non ha ancora scelto il libro: scegline uno qui sotto.</div>`;
      }

      books.forEach((b) => { html += courseCard(b.id, b.units, b.current, b.className, true); });

      const shown = new Set(books.map((b) => b.id));
      if (extra && COURSES[extra] && !shown.has(extra)) html += courseCard(extra, "", "", "Extra practice · Esercizi extra");

      const options = Object.values(COURSES)
        .filter((c) => c.lessons.length)
        .map((c) => `<option value="${esc(c.id)}" ${c.id === extra ? "selected" : ""}>${esc(c.title)}</option>`)
        .join("");
      html += `
        <div class="picker">
          <label for="bookPicker">${books.length ? "Practise another level · Un altro livello" : "Choose your book · Scegli il libro"}</label>
          <select class="big" id="bookPicker"><option value="">—</option>${options}</select>
        </div>`;

      main.innerHTML = `<h2>Practice · Esercizi</h2>` + coachCard() + html;
      bindCoachCard();

      main.querySelector("#bookPicker").addEventListener("change", (e) => {
        try { localStorage.setItem(BOOK_STORE, e.target.value); } catch (_) {}
        renderPractice();
      });
      main.querySelectorAll(".set").forEach((button) => {
        button.addEventListener("click", () => {
          if (button.dataset.kind) startExtra(button.dataset.course, button.dataset.kind, Number(button.dataset.n));
          else startSet(button.dataset.course, button.dataset.lesson, button.dataset.type);
        });
      });
    }

    function courseCard(courseId, unitsText, currentText, label, isClassBook) {
      const course = COURSES[courseId];
      const range = PRACTICE.parseUnits(courseId, unitsText);
      const current = Number(currentText) || 0;
      const res = resultsById();

      const units = {};
      course.lessons.forEach((l) => { (units[l.unit] = units[l.unit] || []).push(l); });

      const unitBlock = (n) => {
        const lessons = units[n] || [];
        let ok = 0, all = 0;
        const rows = lessons.map((l) => {
          const buttons = PRACTICE.SET_TYPES.map((t) => {
            const r = res[`${l.id}-${t}`];
            all++;
            if (passed(r)) ok++;
            const cls = passed(r) ? "passed" : (r ? "tried" : "");
            const mark = r ? ` ${passed(r) ? "✓" : ""} ${r.best}/${r.total}` : "";
            return `<button class="set ${cls}" type="button" data-course="${esc(courseId)}" data-lesson="${esc(l.code)}" data-type="${t}">${TYPE_NAMES[t]}${esc(mark)}</button>`;
          }).join("");
          return `
            <div class="lesson">
              <p class="lesson-title">${esc(l.code)} · ${esc(l.title)}</p>
              <p class="lesson-topic">${esc(l.grammar)} · ${esc(l.vocab)}</p>
              <div class="sets">${buttons}</div>
            </div>`;
        }).join("");
        const isNow = current === n;

        // Review after every 3 units; mini tests (class books only) open
        // when the class reaches the test's last unit.
        let extras = "";
        (course.reviews || []).forEach((block, i) => {
          if (block[1] !== n) return;
          const r = res[`${courseId}-R${i + 1}`];
          const cls = passed(r) ? "passed" : (r ? "tried" : "");
          const mark = r ? ` ${passed(r) ? "✓" : ""} ${r.best}/${r.total}` : "";
          extras += `<button class="set review ${cls}" type="button" data-course="${esc(courseId)}" data-kind="r" data-n="${i + 1}">🔁 Review units ${block[0]}–${block[1]}${esc(mark)}</button>`;
        });
        if (isClassBook) {
          (course.tests || []).forEach((block, i) => {
            if (block[1] !== n || block[1] < range.from || block[0] > range.to) return;
            const r = res[`${courseId}-T${i + 1}`];
            const open = !current || current >= block[1];
            const units = block[0] === block[1] ? `unit ${block[0]}` : `units ${block[0]}–${block[1]}`;
            const mark = r ? ` ✓ ${r.first != null ? r.first : r.best}/${r.total}` : "";
            extras += `<button class="set test ${r ? "passed" : ""}" type="button" data-course="${esc(courseId)}" data-kind="t" data-n="${i + 1}" ${open ? "" : "disabled"}>📝 Mini test (${units})${open ? esc(mark) : " · 🔒"}</button>`;
          });
        }
        if (extras) extras = `<div class="extra-row">${extras}</div>`;

        return `
          <details class="unit" ${isNow || (!current && n === range.from) ? "open" : ""}>
            <summary><span>Unit ${n}${isNow ? '<span class="now">Now · Adesso</span>' : ""}</span><span class="count">${ok}/${all}</span></summary>
            ${rows}
            ${extras}
          </details>`;
      };

      let inRange = "", outRange = "";
      for (let n = 1; n <= course.unitCount; n++) {
        if (n >= range.from && n <= range.to) inRange += unitBlock(n);
        else outRange += unitBlock(n);
      }

      const sub = [];
      if (label) sub.push(esc(label));
      if (unitsText) sub.push(`Units ${range.from}–${range.to}`);
      if (current) sub.push(`now on unit ${current}`);

      return `
        <section class="course">
          <h3>${esc(course.title)}</h3>
          ${sub.length ? `<p class="meta">${sub.join(" · ")}</p>` : ""}
          ${inRange}
          ${outRange ? `<details class="unit"><summary><span>Other units · Altre unità</span></summary>${outRange}</details>` : ""}
        </section>`;
    }

    /* ---------- practice: run a set ---------- */

    async function loadBank(courseId) {
      if (banks[courseId]) return banks[courseId];
      const response = await fetch(COURSES[courseId].bank, { cache: "no-cache" });
      if (!response.ok) throw new Error("bank");
      banks[courseId] = await response.json();
      return banks[courseId];
    }

    function shuffle(list) {
      const a = list.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    async function startSet(courseId, code, type) {
      const main = document.getElementById("main");
      main.innerHTML = `<div class="empty">Loading… · Caricamento…</div>`;
      try {
        const bank = await loadBank(courseId);
        const lesson = COURSES[courseId].lessons.find((l) => l.code === code);
        const items = bank.lessons?.[code]?.[type];
        if (!lesson || !Array.isArray(items) || !items.length) throw new Error("missing");

        quiz = {
          courseId, code, type, lesson,
          setId: `${lesson.id}-${type}`,
          items: type === "s"
            ? items.map((text) => ({ text, best: 0, heard: "", marks: null }))
            : items.map((q) => {
                if (!Array.isArray(q.o)) return { ...q };
                const order = shuffle(q.o.map((_, i) => i));
                return { ...q, o: order.map((i) => q.o[i]), a: order.indexOf(q.a) };
              }),
          index: 0,
          answers: [],
          finished: false,
          saveState: ""
        };
        window.scrollTo(0, 0);
        render();
      } catch (error) {
        quiz = null;
        main.innerHTML = `<div class="error">Could not load this practice. Check your connection and try again. · Controlla la connessione e riprova.</div>`;
      }
    }

    async function loadExtra(courseId) {
      const key = courseId + "|extra";
      if (banks[key]) return banks[key];
      const response = await fetch(COURSES[courseId].extra, { cache: "no-cache" });
      if (!response.ok) throw new Error("extra");
      banks[key] = await response.json();
      return banks[key];
    }

    async function startExtra(courseId, kind, n) {
      const main = document.getElementById("main");
      main.innerHTML = `<div class="empty">Loading… · Caricamento…</div>`;
      try {
        const course = COURSES[courseId];
        const bank = await loadExtra(courseId);
        const K = kind === "t" ? "T" : "R";
        const items = (kind === "t" ? bank.tests : bank.reviews)?.[K + n];
        const block = (kind === "t" ? course.tests : course.reviews)[n - 1];
        if (!Array.isArray(items) || !items.length || !block) throw new Error("missing");
        const units = block[0] === block[1] ? `unit ${block[0]}` : `units ${block[0]}–${block[1]}`;
        quiz = {
          courseId, code: K + n, type: kind, n,
          lesson: { code: K + n, title: kind === "t" ? `Mini test · ${units}` : `Review · ${units}`, grammar: "", vocab: "" },
          setId: `${courseId}-${K}${n}`,
          items: items.map((q) => {
            if (!Array.isArray(q.o)) return { ...q };
            const order = shuffle(q.o.map((_, i) => i));
            return { ...q, o: order.map((i) => q.o[i]), a: order.indexOf(q.a) };
          }),
          index: 0,
          answers: [],
          finished: false,
          saveState: ""
        };
        window.scrollTo(0, 0);
        render();
      } catch (error) {
        quiz = null;
        main.innerHTML = `<div class="error">Could not load this practice. Check your connection and try again. · Controlla la connessione e riprova.</div>`;
      }
    }

    function questionHtml(text) {
      return esc(text).replace(/_{2,}/g, '<span class="blank">&nbsp;</span>');
    }

    function norm(text) {
      return String(text || "")
        .toLowerCase()
        .replace(/[’‘`´]/g, "'")
        .replace(/\s+/g, " ")
        .trim()
        .replace(/[.!?]+$/, "")
        .trim();
    }

    function expand(text) {
      return norm(text)
        .replace(/\bcan't\b/g, "cannot").replace(/\bwon't\b/g, "will not").replace(/\bshan't\b/g, "shall not")
        .replace(/n't\b/g, " not").replace(/'re\b/g, " are").replace(/'m\b/g, " am")
        .replace(/'ll\b/g, " will").replace(/'ve\b/g, " have").replace(/'d\b/g, " would")
        .replace(/\s+/g, " ").trim();
    }

    function typedIsRight(q, input) {
      const given = expand(input);
      if (!given) return false;
      // Accept "I'm not" when the answer is "'m not" / "am not": the word before the gap may be typed too.
      const before = norm(String(q.q).split(/_{2,}/)[0]).split(" ").pop() || "";
      return q.a.some((answer) => {
        const a = expand(answer);
        const withBefore = expand(before + (String(answer).startsWith("'") ? "" : " ") + answer);
        return given === a || given === withBefore;
      });
    }

    function renderQuiz() {
      const main = document.getElementById("main");
      const q = quiz;
      const label = q.type === "x" ? "Test · Verifica" : q.type === "t" ? "Mini test"
        : q.type === "r" ? `${TYPE_NAMES[q.type]} · ${TYPE_IT[q.type]}`
        : `${q.lesson.code} ${TYPE_NAMES[q.type]} · ${TYPE_IT[q.type]}`;
      const dots = q.items.map((_, i) => {
        const a = q.answers[i];
        const cls = a === undefined ? (i === q.index && !q.finished ? "cur" : "")
          : (isExam(q) && !q.finished ? "cur" : (a ? "ok" : "no"));
        return `<span class="${cls}"></span>`;
      }).join("");

      let body = "";
      if (q.finished) body = resultHtml();
      else if (q.type === "s") body = speakHtml();
      else body = questionBlock();

      main.innerHTML = `
        <section class="quiz">
          <div class="quiz-top">
            <button class="link" type="button" id="quizBack">← Back · Indietro</button>
            <span>${esc(label)}</span>
          </div>
          <p class="lesson-topic" style="margin:0">${esc([q.lesson.title, q.type === "v" ? q.lesson.vocab : q.lesson.grammar].filter(Boolean).join(" · "))}</p>
          ${isExam(q) && !q.finished ? `<p class="note" style="margin-top:8px">${q.type === "x" ? "Test" : "Mini test"}: answer all the questions, then see your score and the answers. Your first score goes to your teacher. · Il primo risultato va all'insegnante.</p>` : ""}
          <div class="dots">${dots}</div>
          ${body}
        </section>`;

      main.querySelector("#quizBack").addEventListener("click", () => { stopListening(); quiz = null; render(); });
      if (q.finished) bindResult();
      else if (q.type === "s") bindSpeak();
      else bindQuestion();
    }

    function questionBlock() {
      const q = quiz;
      const item = q.items[q.index];
      const answered = q.answers[q.index] !== undefined;
      let html = `<p class="question">${questionHtml(item.q)}</p>`;

      if (Array.isArray(item.o)) {
        html += `<div class="options">` + item.o.map((option, i) => {
          let cls = "";
          if (answered) {
            if (isExam(quiz)) cls = i === item.picked ? "picked" : "";
            else if (i === item.a) cls = "right";
            else if (i === item.picked) cls = "wrong";
          }
          return `<button class="option ${cls}" type="button" data-i="${i}" ${answered ? "disabled" : ""}>${esc(option)}</button>`;
        }).join("") + `</div>`;
      } else {
        html += `
          <form class="typed" id="typedForm" autocomplete="off">
            <input class="big" id="typedInput" type="text" autocapitalize="off" autocorrect="off" spellcheck="false"
                   value="${esc(item.typed || "")}" ${answered ? "disabled" : ""} placeholder="Type your answer · Scrivi">
            ${answered ? "" : `<button class="primary" type="submit">Check</button>`}
          </form>`;
      }

      if (answered && isExam(q)) {
        html += `<div class="actions"><button class="primary" type="button" id="nextQ">${q.index + 1 < q.items.length ? "Next · Avanti →" : "Finish · Fine"}</button></div>`;
      } else if (answered) {
        const right = q.answers[q.index];
        const answerText = Array.isArray(item.o) ? item.o[item.a] : item.a[0];
        html += `
          <div class="feedback ${right ? "ok" : "no"}">
            <strong>${right ? "✓ Right! · Giusto!" : `✗ Not quite · Risposta: ${esc(answerText)}`}</strong>
            ${esc(item.e || "")}
          </div>
          <div class="actions"><button class="primary" type="button" id="nextQ">${q.index + 1 < q.items.length ? "Next · Avanti →" : "See my score · Risultato"}</button></div>`;
      }
      return html;
    }

    function bindQuestion() {
      const main = document.getElementById("main");
      const item = quiz.items[quiz.index];
      main.querySelectorAll(".option").forEach((button) => {
        button.addEventListener("click", () => {
          const i = Number(button.dataset.i);
          item.picked = i;
          quiz.answers[quiz.index] = i === item.a;
          renderQuiz();
        });
      });
      const form = main.querySelector("#typedForm");
      if (form && !form.querySelector("input").disabled) {
        const input = form.querySelector("input");
        input.focus();
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          if (!input.value.trim()) return;
          item.typed = input.value;
          quiz.answers[quiz.index] = quiz.type === "x" ? false : typedIsRight(item, input.value);
          renderQuiz();
        });
      }
      const next = main.querySelector("#nextQ");
      if (next) {
        next.addEventListener("click", nextItem);
        next.focus();
      }
    }

    function nextItem() {
      if (quiz.index + 1 < quiz.items.length) quiz.index++;
      else finishSet();
      renderQuiz();
    }

    function isExam(q) { return q && (q.type === "t" || q.type === "x"); }

    function finishSet() {
      quiz.finished = true;
      if (quiz.type === "x") submitTeacherTest();
      else saveResult();
    }

    function score() {
      if (quiz.type === "x") return quiz.serverScore ?? 0;
      if (quiz.type === "s") return quiz.items.filter((x) => x.best >= SPEAK_PASS).length;
      return quiz.answers.filter(Boolean).length;
    }

    function resultHtml() {
      const total = quiz.items.length;
      const got = score();
      const ok = got / total >= PRACTICE.PASS_MARK;
      if (quiz.type === "x" && quiz.saveState !== "saved") {
        return `<div class="result"><div class="saved">${quiz.saveState === "failed"
          ? "Not sent: check your connection. · Non inviato."
          : "Marking your test… · Correzione in corso…"}</div></div>
          <div class="actions">${quiz.saveState === "failed" ? `<button class="primary" type="button" id="retrySave">Send again · Riprova</button>` : ""}
          <button class="secondary" type="button" id="done">Back · Indietro</button></div>`;
      }
      const saved = {
        saving: "Saving… · Salvataggio…",
        saved: quiz.type === "x" ? "✓ Sent to your teacher · Inviato all'insegnante" : "✓ Saved to your progress · Salvato",
        failed: "Not saved: check your connection. · Non salvato.",
        offline: "Practice scores will be saved soon. · Presto salveremo i risultati."
