<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>My English | London Language School</title>
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="homework.webmanifest">
  <meta name="theme-color" content="#0b3b78">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LLS Homework">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --navy-950: #061b37;
      --navy-800: #0b3b78;
      --navy-100: #eaf1fa;
      --navy-50: #f4f7fc;
      --red-600: #ee3124;
      --red-100: #ffe9e6;
      --green-700: #177b52;
      --green-100: #e3f4ec;
      --amber-700: #9a5a0c;
      --amber-100: #fdf1dc;
      --ink-900: #14213d;
      --ink-600: #56617a;
      --ink-200: #dfe4ec;
      --card: #ffffff;
      --page: #f6f8fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink-900);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.45;
    }

    header {
      background: linear-gradient(180deg, var(--navy-950), var(--navy-800));
      color: #fff;
      padding: 20px 16px 28px;
    }

    .wrap { max-width: 640px; margin: 0 auto; }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 44px; height: 44px; border-radius: 50%; background: #fff; object-fit: contain; }
    .brand strong { display: block; font-size: 17px; letter-spacing: .02em; }
    .brand span { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 13px; opacity: .85; }

    h1 { font-size: 26px; margin: 22px 0 4px; }
    .sub { margin: 0; opacity: .85; font-size: 14px; }

    .progress-card {
      background: var(--card);
      color: var(--ink-900);
      border-radius: 14px;
      padding: 16px;
      margin: -14px auto 0;
      box-shadow: 0 6px 20px rgba(6, 27, 55, .10);
    }
    .progress-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .progress-top strong { font-size: 15px; }
    .progress-top span { font-size: 14px; color: var(--ink-600); }
    .bar { height: 12px; background: var(--navy-100); border-radius: 99px; overflow: hidden; margin-top: 10px; }
    .bar div { height: 100%; width: 0; background: var(--green-700); border-radius: 99px; transition: width .4s ease; }

    main { padding: 8px 16px 40px; }

    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-600); margin: 26px 0 10px; }

    .item {
      background: var(--card);
      border: 1px solid var(--ink-200);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 12px;
      align-items: start;
    }
    .item.done { background: var(--navy-50); }
    .item.done .title { text-decoration: line-through; color: var(--ink-600); }
    .title { font-weight: 700; font-size: 16px; margin: 0; overflow-wrap: anywhere; }
    .meta { font-size: 13px; color: var(--ink-600); margin: 2px 0 0; }
    .desc { grid-column: 1 / -1; font-size: 14px; margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }

    .due { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; margin-top: 6px; }
    .due.soon { background: var(--amber-100); color: var(--amber-700); }
    .due.late { background: var(--red-100); color: #b3261e; }
    .due.ok { background: var(--navy-100); color: var(--navy-800); }

    .tick {
      min-width: 92px;
      min-height: 44px;
      border: 2px solid var(--green-700);
      background: #fff;
      color: var(--green-700);
      border-radius: 10px;
      font: inherit;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      padding: 6px 10px;
    }
    .tick.is-done { background: var(--green-700); color: #fff; }
    .tick:disabled { opacity: .6; cursor: wait; }

    .empty, .error {
      background: var(--card);
      border: 1px dashed var(--ink-200);
      border-radius: 14px;
      padding: 22px 16px;
      text-align: center;
      color: var(--ink-600);
    }
    .error { border-style: solid; border-color: var(--red-600); color: var(--ink-900); }

    .classes { font-size: 13px; color: var(--ink-600); margin-top: 8px; }


    /* V18: tabs + practice */
    .tabs { display: flex; gap: 8px; margin: 18px 0 4px; }
    .tabs[hidden] { display: none; }
    .tab {
      flex: 1; min-height: 44px; border: 2px solid var(--navy-800); background: #fff; color: var(--navy-800);
      border-radius: 12px; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer;
    }
    .tab[aria-selected="true"] { background: var(--navy-800); color: #fff; }
    .split { font-size: 13px; color: var(--ink-600); margin-top: 6px; }

    .course { background: var(--card); border: 1px solid var(--ink-200); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
    .course h3 { margin: 0; font-size: 17px; }
    .course .meta { margin-top: 2px; }
    details.unit { border-top: 1px solid var(--ink-200); padding: 10px 0 4px; margin-top: 10px; }
    details.unit summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 8px; min-height: 32px; align-items: center; }
    details.unit summary::-webkit-details-marker { display: none; }
    details.unit summary::after { content: "▾"; color: var(--ink-600); }
    details.unit[open] summary::after { content: "▴"; }
    .now { font-size: 12px; font-weight: 700; background: var(--amber-100); color: var(--amber-700); border-radius: 99px; padding: 2px 8px; margin-left: 6px; }
    .count { font-size: 13px; font-weight: 600; color: var(--ink-600); margin-left: auto; margin-right: 6px; }
    .lesson { padding: 10px 0; border-bottom: 1px dashed var(--ink-200); }
    .lesson:last-child { border-bottom: 0; }
    .lesson-title { font-weight: 700; font-size: 15px; margin: 0; }
    .lesson-topic { font-size: 13px; color: var(--ink-600); margin: 2px 0 8px; }
    .sets { display: flex; flex-wrap: wrap; gap: 8px; }
    .set {
      min-height: 40px; border: 1.5px solid var(--ink-200); background: var(--navy-50); color: var(--ink-900);
      border-radius: 10px; padding: 6px 12px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .set.passed { border-color: var(--green-700); background: var(--green-100); color: var(--green-700); }
    .set.tried { border-color: var(--amber-700); background: var(--amber-100); color: var(--amber-700); }
    .set.review { border-style: dashed; }
    .set.test { border-color: var(--navy-800); background: #fff; color: var(--navy-800); }
    .set.test.passed { border-color: var(--green-700); background: var(--green-100); color: var(--green-700); }
    .set:disabled { opacity: .55; cursor: not-allowed; }
    .extra-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0 4px; border-top: 1px dashed var(--ink-200); }
    .option.picked { border-color: var(--navy-800); background: var(--navy-100); }
    .answers { display: grid; gap: 10px; margin-top: 14px; text-align: left; }
    .answer { border: 1px solid var(--ink-200); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
    .answer.ok { border-color: var(--green-700); }
    .answer.no { border-color: var(--red-600); }
    .answer p { margin: 2px 0; }
    .picker { background: var(--card); border: 1px solid var(--ink-200); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
    .picker label { font-size: 14px; font-weight: 600; display: block; margin-bottom: 6px; }
    select.big, input.big {
      width: 100%; min-height: 46px; font: inherit; font-size: 16px; padding: 8px 12px;
      border: 1.5px solid var(--ink-200); border-radius: 10px; background: #fff; color: var(--ink-900);
    }

    .quiz { background: var(--card); border: 1px solid var(--ink-200); border-radius: 14px; padding: 16px; margin-top: 18px; }
    .quiz-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-600); }
    .link { background: none; border: 0; color: var(--navy-800); font: inherit; font-weight: 700; cursor: pointer; padding: 8px 0; min-height: 40px; }
    .dots { display: flex; gap: 5px; margin: 10px 0 14px; }
    .dots span { flex: 1; height: 6px; border-radius: 99px; background: var(--navy-100); }
    .dots span.ok { background: var(--green-700); }
    .dots span.no { background: var(--red-600); }
    .dots span.cur { background: var(--navy-800); }
    .question { font-size: 19px; font-weight: 600; margin: 0 0 14px; overflow-wrap: anywhere; }
    .blank { display: inline-block; min-width: 56px; border-bottom: 2.5px solid var(--navy-800); margin: 0 2px; }
    .options { display: grid; gap: 10px; }
    .option {
      text-align: left; min-height: 50px; border: 2px solid var(--ink-200); background: #fff; color: var(--ink-900);
      border-radius: 12px; padding: 10px 14px; font: inherit; font-size: 17px; cursor: pointer;
    }
    .option.right { border-color: var(--green-700); background: var(--green-100); }
    .option.wrong { border-color: var(--red-600); background: var(--red-100); }
    .option:disabled { cursor: default; }
    .typed { display: flex; gap: 8px; }
    .typed input { flex: 1; }
    .primary {
      min-height: 46px; border: 0; background: var(--navy-800); color: #fff; border-radius: 12px;
      padding: 10px 18px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .primary:disabled { opacity: .5; cursor: default; }
    .secondary {
      min-height: 46px; border: 2px solid var(--navy-800); background: #fff; color: var(--navy-800); border-radius: 12px;
      padding: 10px 18px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .feedback { border-radius: 12px; padding: 12px 14px; margin-top: 14px; font-size: 15px; }
    .feedback.ok { background: var(--green-100); color: #0f5236; }
    .feedback.no { background: var(--red-100); color: #7a1c14; }
    .feedback strong { display: block; margin-bottom: 2px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .result { text-align: center; padding: 10px 0; }
    .result .big-score { font-size: 42px; font-weight: 800; margin: 6px 0; }
    .saved { font-size: 13px; color: var(--ink-600); }
    .say { font-size: 22px; font-weight: 600; line-height: 1.4; margin: 6px 0 16px; overflow-wrap: anywhere; }
    .say .hit { color: var(--green-700); }
    .say .miss { color: #b3261e; text-decoration: underline wavy; }
    .heard { font-size: 14px; color: var(--ink-600); margin-top: 10px; }
    .mic.listening { background: var(--red-600); }
    .note { font-size: 13px; color: var(--ink-600); background: var(--navy-50); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }

    /* V19: AI Speaking Coach */
    .coach-card { background: linear-gradient(135deg, #0b3b78, #1d5fb3); color: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .coach-card h3 { margin: 0 0 6px; font-size: 18px; }
    .coach-card p { margin: 0 0 10px; font-size: 14px; opacity: .95; }
    .coach-card .meta { color: #dbe7f7; }
    .coach-card select { margin-bottom: 10px; }
    .coach-card .primary { background: #fff; color: var(--navy-800); width: 100%; }
    .coach-badge { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; background: var(--red-600); color: #fff; border-radius: 99px; padding: 2px 8px; vertical-align: middle; margin-left: 4px; }
    .coach-list { margin: 0 0 10px; padding-left: 18px; font-size: 14px; display: grid; gap: 2px; }
    .coach-card .coach-price { font-size: 20px; font-weight: 800; margin: 4px 0 10px; }
    .coach-price span { font-size: 14px; font-weight: 500; opacity: .85; }
    .coach-actions { display: grid; gap: 8px; }
    .coach-sent { background: rgba(255,255,255,.15); border-radius: 10px; padding: 10px 12px; margin: 0; font-size: 14px; }
    .chat { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
    .bubble { max-width: 86%; padding: 10px 12px; border-radius: 14px; font-size: 16px; line-height: 1.4; overflow-wrap: anywhere; }
    .bubble.c { align-self: flex-start; background: var(--navy-50); border: 1px solid var(--ink-200); }
    .bubble.s { align-self: flex-end; background: var(--navy-800); color: #fff; }
    .bubble .fix { display: block; margin-top: 6px; font-size: 14px; background: var(--amber-100); color: #5c3606; border-radius: 8px; padding: 6px 8px; }
    .bubble .replay { background: none; border: 0; font-size: 16px; cursor: pointer; padding: 0 0 0 6px; }
    .bubble.thinking { color: var(--ink-600); font-style: italic; }
    .chat-controls { display: grid; gap: 8px; }
    .chat-controls form { display: flex; gap: 8px; }
    .chat-controls input { flex: 1; }

    footer { text-align: center; font-size: 12px; color: var(--ink-600); padding: 0 16px 28px; }
    footer a { color: var(--navy-800); }

    /* V24 Student Portal login */
    .login-card { background: var(--card); border: 1px solid var(--ink-200); border-radius: 16px; padding: 22px 18px; display: grid; gap: 12px; }
    .login-card h2 { margin: 0; font-size: 20px; text-transform: none; letter-spacing: 0; color: var(--ink-900); }
    .login-card p { margin: 0; color: var(--ink-600); font-size: 15px; line-height: 1.45; }
    .login-card label { font-weight: 700; font-size: 14px; }
    .code-input { width: 100%; box-sizing: border-box; font: inherit; font-size: 24px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; text-align: center; padding: 12px; border: 2px solid var(--ink-200); border-radius: 12px; }
    .code-input:focus { outline: none; border-color: var(--navy-800); }
    .login-card .primary { width: 100%; min-height: 50px; font-size: 17px; }
    .login-msg { min-height: 1.2em; color: #b3261e; font-weight: 600; font-size: 14px; }
    .login-tips { font-size: 14px; color: var(--ink-600); background: var(--navy-50); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand">
        <img src="logo.png" alt="">
        <div>
          <strong>London Language School</strong>
          <span>We make English fun!</span>
        </div>
      </div>
      <h1 id="hello">My homework</h1>
      <p class="sub" id="subtitle">I compiti di inglese</p>
    </div>
  </header>

  <div class="wrap" style="padding: 0 16px;">
    <section class="progress-card" id="progressCard" hidden>
      <div class="progress-top">
        <strong>Progress · Progressi</strong>
        <span id="progressText"></span>
      </div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progressBar"><div></div></div>
      <div class="split" id="progressSplit"></div>
      <div class="classes" id="classList"></div>
    </section>
    <nav class="tabs" id="tabs" role="tablist" hidden>
      <button class="tab" type="button" role="tab" id="tabHomework" aria-selected="true">📝 Homework · Compiti</button>
      <button class="tab" type="button" role="tab" id="tabPractice" aria-selected="false">🎯 Practice · Esercizi</button>
    </nav>
  </div>

  <main class="wrap" id="main">
    <div class="empty">Loading your homework… · Caricamento…</div>
  </main>

  <footer>Questions? Ask your teacher or the school office. <span id="switchWrap" hidden>· <a href="#" id="switchStudent">Non sei tu? Cambia studente · Switch student</a></span></footer>

  <script src="practice/courses.js"></script>
  <script>
    "use strict";

    const API_URL = "https://script.google.com/macros/s/AKfycbyHbfFoaiMOT1rpY2DcbXAkuNwMoOHVdLlG2aQLgPgCe5gqPuyk8VYm7i4eGQRm8iqi/exec";
    // Remember this student's key on the phone, so the home-screen icon
    // still works if the phone opens it without the ?k= part.
    const STORE = "lls_homework_key";
    let KEY = new URLSearchParams(location.search).get("k") || "";
    try {
      if (KEY) localStorage.setItem(STORE, KEY);
      else KEY = localStorage.getItem(STORE) || "";
    } catch (_) {}
    let data = null;

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    async function api(params) {
      const url = new URL(API_URL);
      Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
      url.searchParams.set("_", Date.now());
      const response = await fetch(url.toString(), { cache: "no-store", redirect: "follow" });
      const result = JSON.parse(await response.text());
      if (!result || result.success !== true) throw new Error(result?.error || "Something went wrong.");
      return result;
    }

    function parseDate(text) {
      const raw = String(text || "").trim();
      const m = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
      const uk = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); // sheet shows UK dates
      return uk ? new Date(+uk[3], +uk[2] - 1, +uk[1]) : null;
    }

    function dueBadge(text, isDone) {
      const due = parseDate(text);
      if (!due) return "";
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const days = Math.round((due - today) / 86400000);
      const label = due.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
      if (isDone) return `<span class="due ok">Due ${esc(label)}</span>`;
      if (days < 0) return `<span class="due late">Late · was due ${esc(label)}</span>`;
      if (days === 0) return `<span class="due soon">Due today · Per oggi</span>`;
      if (days === 1) return `<span class="due soon">Due tomorrow · Per domani</span>`;
      return `<span class="due ok">Due ${esc(label)}</span>`;
    }

    const COURSES = window.LLS_COURSES || {};
    const PRACTICE = window.LLS_PRACTICE;
    const TYPE_NAMES = { g: "Grammar", v: "Vocabulary", s: "Speaking", r: "Review", t: "Mini test" };
    const TYPE_IT = { g: "Grammatica", v: "Vocabolario", s: "Pronuncia", r: "Ripasso", t: "Mini test" };
    const BOOK_STORE = "lls_practice_book";
    let tab = location.hash === "#practice" ? "practice" : "homework";
    let banks = {};
    let quiz = null;

    /* ---------- progress (homework 80% + practice 20%) ---------- */

    function homeworkItems() {
      const classById = {};
      data.classes.forEach((c) => { classById[String(c["Class ID"])] = c; });
      const statusById = {};
      data.status.forEach((s) => { statusById[String(s["Homework ID"])] = s["Status"]; });
      return data.homework.map((h) => ({
        ...h,
        done: statusById[String(h["Homework ID"])] === "Done",
        className: classById[String(h["Class ID"])]?.["Class Name"] || ""
      }));
    }

    // The class books this student practises with (deduplicated).
    function myBooks() {
      const seen = {};
      const list = [];
      data.classes.forEach((c) => {
        const id = String(c["Book"] || "").trim();
        if (!COURSES[id] || !COURSES[id].lessons.length) return;
        const units = String(c["Units"] || "").trim();
        const k = id + "|" + units;
        if (seen[k]) return;
        seen[k] = true;
        list.push({ id, units, current: String(c["Current Unit"] || "").trim(), className: c["Class Name"] });
      });
      return list;
    }

    function resultsById() {
      const map = {};
      (data.practice || []).forEach((r) => { map[String(r.setId)] = r; });
      return map;
    }

    function passed(r) {
      return r && Number(r.total) > 0 && Number(r.best) / Number(r.total) >= PRACTICE.PASS_MARK;
    }

    function practiceCounts() {
      if (!PRACTICE) return { done: 0, total: 0 };
      const ids = new Set();
      myBooks().forEach((b) => PRACTICE.practiceSetIdsFor(b.id, b.units, b.current).forEach((id) => ids.add(id)));
      const res = resultsById();
      let done = 0;
      ids.forEach((id) => { if (passed(res[id])) done++; });
      return { done, total: ids.size };
    }

    function renderProgress() {
      const items = homeworkItems();
      const hwDone = items.filter((i) => i.done).length;
      const hwTotal = items.length;
      const tests = data.tests || [];
      const testsDone = tests.filter((t) => testResultFor(t.testId)).length;
      // Everything set counts equally: homework, tests, reviews, mini tests = 1 point;
      // each lesson practice set = 1/3.
      const p = PRACTICE
        ? PRACTICE.progressPoints({
            homeworkDone: hwDone, homeworkTotal: hwTotal,
            testsDone, testsTotal: tests.length,
            results: data.practice || [],
            books: myBooks()
          })
        : { pct: hwTotal ? Math.round((hwDone / hwTotal) * 100) : 0, available: hwTotal, homework: [hwDone, hwTotal], tests: [0, 0], practice: [0, 0] };
      const pct = p.pct;

      document.getElementById("progressCard").hidden = false;
      document.getElementById("progressText").textContent = p.available ? `${pct}%` : "Let's start! · Iniziamo!";
      const bar = document.getElementById("progressBar");
      bar.setAttribute("aria-valuenow", String(pct));
      bar.firstElementChild.style.width = pct + "%";

      const parts = [];
      parts.push(hwTotal ? `Homework ${hwDone}/${hwTotal}` : "No homework yet");
      if (p.tests[1]) parts.push(`Tests ${p.tests[0]}/${p.tests[1]}`);
      if (p.practice[1]) parts.push(`Practice ${Math.round((p.practice[0] / p.practice[1]) * 100)}%`);
      document.getElementById("progressSplit").textContent = parts.join(" · ");
      document.getElementById("classList").textContent = data.classes.length
        ? "Class: " + data.classes.map((c) => c["Class Name"]).join(", ")
        : "";

    function render() {
      const name = data.student.firstName;
      document.getElementById("hello").textContent = name ? `Hi ${name}!` : "My English";
      document.getElementById("subtitle").textContent = "Homework and practice · Compiti ed esercizi";

      if (quiz) renderQuiz();

    function setTab(next) {
      tab = next;
      quiz = null;
      if (chat) endChat();
      try { history.replaceState(null, "", next === "practice" ? "#practice" : location.pathname + location.search); } catch (_) {}
      render();
    }
    document.getElementById("tabHomework").addEventListener("click", () => setTab("homework"));
    document.getElementById("tabPractice").addEventListener("click", () => setTab("practice"));

    /* ---------- homework ---------- */

    function testsHtml() {
      const tests = (data.tests || []).slice().sort((a, b) => String(a.dueDate || "9999").localeCompare(String(b.dueDate || "9999")));
      if (!tests.length) return "";

      return `<h2>Tests · Verifiche (${tests.length})</h2>` + tests.map((t) => {

          <article class="item ${r ? "done" : ""}">

              <p class="title" style="text-decoration:none">📝 ${esc(t.title)}</p>
              <p class="meta">${esc(classById[t.classId]?.["Class Name"] || "")} · ${t.count} questions · domande</p>
              ${r ? `<span class="due ok">Your score · Punteggio: ${r.first}/${r.total}</span>` : dueBadge(t.dueDate, false)}
            </div>
            <button class="tick ${r ? "is-done" : ""}" type="button" data-test="${esc(t.testId)}">${r ? "Try again" : "Start · Inizia"}</button>
          </article>`;

    function renderHomework() {
      const main = document.getElementById("main");
      const items = homeworkItems();

      if (!items.length) {
        main.innerHTML = testsHtml() + `<div class="empty" style="margin-top:18px">No homework yet. 🎉<br>Nessun compito per ora.<br><br>Why not try some practice? · Prova gli esercizi!</div>`;
        main.querySelectorAll("[data-test]").forEach((b) => b.addEventListener("click", () => startTeacherTest(b.dataset.test)));
        return;
      }

      const byDue = (a, b) => String(a["Due Date"] || "9999").localeCompare(String(b["Due Date"] || "9999"));

      const finished = items.filter((i) => i.done).sort(byDue).reverse();

      const card_ = (i) => `
        <article class="item ${i.done ? "done" : ""}">
          <div>
            <p class="title">${esc(i["Title"])}</p>
            ${i.className ? `<p class="meta">${esc(i.className)}</p>` : ""}
            ${dueBadge(i["Due Date"], i.done)}
          </div>
          <button class="tick ${i.done ? "is-done" : ""}" type="button"
                  data-id="${esc(i["Homework ID"])}" data-next="${i.done ? "Not started" : "Done"}"
                  aria-pressed="${i.done}">
            ${i.done ? "Done ✓" : "Mark done"}
          </button>
          ${i["Description"] ? `<p class="desc">${esc(i["Description"])}</p>` : ""}
        </article>`;

      main.innerHTML = testsHtml() +
        `<h2>To do · Da fare (${todo.length})</h2>` +
        (todo.length ? todo.map(card_).join("") : `<div class="empty">All done! Well done. 🎉<br>Tutto fatto, bravo/a!</div>`) +
        (finished.length ? `<h2>Done · Fatti (${finished.length})</h2>` + finished.map(card_).join("") : "");

      main.querySelectorAll(".tick[data-id]").forEach((button) => {
        button.addEventListener("click", () => toggle(button));
      });
      main.querySelectorAll("[data-test]").forEach((b) => b.addEventListener("click", () => startTeacherTest(b.dataset.test)));
    }

    async function toggle(button) {
      const id = button.dataset.id;
      const next = button.dataset.next;
      button.disabled = true;
      button.textContent = "Saving…";

      try {
        await api({
          action: "mutate",
          payload: JSON.stringify({ action: "studentMarkHomework", key: KEY, homeworkId: id, status: next })
        });
        const existing = data.status.find((s) => String(s["Homework ID"]) === id);
        if (existing) existing["Status"] = next;
        else data.status.push({ "Homework ID": id, "Status": next });
        render();
      } catch (error) {
        button.disabled = false;
        button.textContent = next === "Done" ? "Mark done" : "Done ✓";
        alert("Could not save. Please try again.\nNon è stato possibile salvare. Riprova.");
      }
    }

    /* ---------- practice: choose a unit ---------- */

    function chosenBook() {
      try { return localStorage.getItem(BOOK_STORE) || ""; } catch (_) { return ""; }
    }

    function renderPractice() {
      const main = document.getElementById("main");
      if (!PRACTICE) {
        main.innerHTML = `<div class="error">Practice could not load. Please refresh the page.</div>`;
        return;
      }

      const books = myBooks();
      const extra = chosenBook();
      let html = "";

      if (!books.length) {
        html += `<div class="note" style="margin-top:18px">Your teacher hasn't chosen your practice book yet. Choose one below. ·

      }

      main.querySelectorAll(".set").forEach((button) => {
        button.addEventListener("click", () => {
          if (button.dataset.kind) startExtra(button.dataset.course, button.dataset.kind, Number(button.dataset.n));
          else startSet(button.dataset.course, button.dataset.lesson, button.dataset.type);
        });

    }

    function courseCard(courseId, unitsText, currentText, label, isClassBook) {
      const course = COURSES[courseId];
      const range = PRACTICE.parseUnits(courseId, unitsText);
      const current = Number(currentText) || 0;
      const res = resultsById();

      const units = {};
      course.lessons.forEach((l) => { (units[l.unit] = units[l.unit] || []).push(l); });

      const unitBlock = (n) => {
        const lessons = units[n] || [];
        let ok = 0, all = 0;
        const rows = lessons.map((l) => {
          const buttons = PRACTICE.SET_TYPES.map((t) => {
            const r = res[`${l.id}-${t}`];
            all++;
            if (passed(r)) ok++;
            const cls = passed(r) ? "passed" : (r ? "tried" : "");
            const mark = r ? ` ${passed(r) ? "✓" : ""} ${r.best}/${r.total}` : "";
            return `<button class="set ${cls}" type="button" data-course="${esc(courseId)}" data-lesson="${esc(l.code)}" data-type="${t}">${TYPE_NAMES[t]}${esc(mark)}</button>`;
          }).join("");
          return `
            <div class="lesson">
              <p class="lesson-title">${esc(l.code)} · ${esc(l.title)}</p>
              <p class="lesson-topic">${esc(l.grammar)} · ${esc(l.vocab)}</p>
              <div class="sets">${buttons}</div>
            </div>`;
        }).join("");
        const isNow = current === n;

        // Review after every 3 units; mini tests (class books only) open
        // when the class reaches the test's last unit.
        let extras = "";
        (course.reviews || []).forEach((block, i) => {
          if (block[1] !== n) return;
          const r = res[`${courseId}-R${i + 1}`];
          const cls = passed(r) ? "passed" : (r ? "tried" : "");
          const mark = r ? ` ${passed(r) ? "✓" : ""} ${r.best}/${r.total}` : "";
          extras += `<button class="set review ${cls}" type="button" data-course="${esc(courseId)}" data-kind="r" data-n="${i + 1}">🔁 Review units ${block[0]}–${block[1]}${esc(mark)}</button>`;
        });
        if (isClassBook) {
          (course.tests || []).forEach((block, i) => {
            if (block[1] !== n || block[1] < range.from || block[0] > range.to) return;
            const r = res[`${courseId}-T${i + 1}`];
            const open = !current || current >= block[1];
            const units = block[0] === block[1] ? `unit ${block[0]}` : `units ${block[0]}–${block[1]}`;
            const mark = r ? ` ✓ ${r.first != null ? r.first : r.best}/${r.total}` : "";
            extras += `<button class="set test ${r ? "passed" : ""}" type="button" data-course="${esc(courseId)}" data-kind="t" data-n="${i + 1}" ${open ? "" : "disabled"}>📝 Mini test (${units})${open ? esc(mark) : " · 🔒"}</button>`;
          });
        }
        if (extras) extras = `<div class="extra-row">${extras}</div>`;

        return `
          <details class="unit" ${isNow || (!current && n === range.from) ? "open" : ""}>
            <summary><span>Unit ${n}${isNow ? '<span class="now">Now · Adesso</span>' : ""}</span><span class="count">${ok}/${all}</span></summary>
            ${rows}
            ${extras}
          </details>`;
      };

      let inRange = "", outRange = "";
      for (let n = 1; n <= course.unitCount; n++) {
        if (n >= range.from && n <= range.to) inRange += unitBlock(n);
        else outRange += unitBlock(n);
      }

      const sub = [];
      if (label) sub.push(esc(label));
      if (unitsText) sub.push(`Units ${range.from}–${range.to}`);
      if (current) sub.push(`now on unit ${current}`);

      return `
        <section class="course">
          <h3>${esc(course.title)}</h3>
          ${sub.length ? `<p class="meta">${sub.join(" · ")}</p>` : ""}
          ${inRange}
          ${outRange ? `<details class="unit"><summary><span>Other units · Altre unità</span></summary>${outRange}</details>` : ""}
        </section>`;
    }

    /* ---------- practice: run a set ---------- */

    async function loadBank(courseId) {
      if (banks[courseId]) return banks[courseId];
      const response = await fetch(COURSES[courseId].bank, { cache: "no-cache" });
      if (!response.ok) throw new Error("bank");
      banks[courseId] = await response.json();
      return banks[courseId];
    }

    function shuffle(list) {
      const a = list.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    async function startSet(courseId, code, type) {
      const main = document.getElementById("main");
      main.innerHTML = `<div class="empty">Loading… · Caricamento…</div>`;
      try {
        const bank = await loadBank(courseId);
        const lesson = COURSES[courseId].lessons.find((l) => l.code === code);
        const items = bank.lessons?.[code]?.[type];
        if (!lesson || !Array.isArray(items) || !items.length) throw new Error("missing");

        quiz = {
          courseId, code, type, lesson,
          setId: `${lesson.id}-${type}`,
          items: type === "s"
            ? items.map((text) => ({ text, best: 0, heard: "", marks: null }))
            : items.map((q) => {
                if (!Array.isArray(q.o)) return { ...q };
                const order = shuffle(q.o.map((_, i) => i));
                return { ...q, o: order.map((i) => q.o[i]), a: order.indexOf(q.a) };
              }),
          index: 0,
          answers: [],
          finished: false,
          saveState: ""
        };
        window.scrollTo(0, 0);
        render();
      } catch (error) {
        quiz = null;
        main.innerHTML = `<div class="error">Could not load this practice. Check your connection and try again. · Controlla la connessione e riprova.</div>`;
      }
    }

    async function loadExtra(courseId) {
      const key = courseId + "|extra";
      if (banks[key]) return banks[key];
      const response = await fetch(COURSES[courseId].extra, { cache: "no-cache" });
      if (!response.ok) throw new Error("extra");
      banks[key] = await response.json();
      return banks[key];
    }

    async function startExtra(courseId, kind, n) {
      const main = document.getElementById("main");
      main.innerHTML = `<div class="empty">Loading… · Caricamento…</div>`;
      try {
        const course = COURSES[courseId];
        const bank = await loadExtra(courseId);
        const K = kind === "t" ? "T" : "R";
        const items = (kind === "t" ? bank.tests : bank.reviews)?.[K + n];
        const block = (kind === "t" ? course.tests : course.reviews)[n - 1];
        if (!Array.isArray(items) || !items.length || !block) throw new Error("missing");
        const units = block[0] === block[1] ? `unit ${block[0]}` : `units ${block[0]}–${block[1]}`;
        quiz = {
          courseId, code: K + n, type: kind, n,
          lesson: { code: K + n, title: kind === "t" ? `Mini test · ${units}` : `Review · ${units}`, grammar: "", vocab: "" },
          setId: `${courseId}-${K}${n}`,
          items: items.map((q) => {
            if (!Array.isArray(q.o)) return { ...q };
            const order = shuffle(q.o.map((_, i) => i));
            return { ...q, o: order.map((i) => q.o[i]), a: order.indexOf(q.a) };
          }),
          index: 0,
          answers: [],
          finished: false,
          saveState: ""
        };
        window.scrollTo(0, 0);
        render();
      } catch (error) {
        quiz = null;
        main.innerHTML = `<div class="error">Could not load this practice. Check your connection and try again. · Controlla la connessione e riprova.</div>`;
      }
    }

    function questionHtml(text) {
      return esc(text).replace(/_{2,}/g, '<span class="blank">&nbsp;</span>');
    }

    function norm(text) {
      return String(text || "")
        .toLowerCase()
        .replace(/[’‘`´]/g, "'")
        .replace(/\s+/g, " ")
        .trim()
        .replace(/[.!?]+$/, "")
        .trim();
    }

    function expand(text) {
      return norm(text)
        .replace(/\bcan't\b/g, "cannot").replace(/\bwon't\b/g, "will not").replace(/\bshan't\b/g, "shall not")
        .replace(/n't\b/g, " not").replace(/'re\b/g, " are").replace(/'m\b/g, " am")
        .replace(/'ll\b/g, " will").replace(/'ve\b/g, " have").replace(/'d\b/g, " would")
        .replace(/\s+/g, " ").trim();
    }

    function typedIsRight(q, input) {
      const given = expand(input);
      if (!given) return false;
      // Accept "I'm not" when the answer is "'m not" / "am not": the word before the gap may be typed too.
      const before = norm(String(q.q).split(/_{2,}/)[0]).split(" ").pop() || "";
      return q.a.some((answer) => {
        const a = expand(answer);
        const withBefore = expand(before + (String(answer).startsWith("'") ? "" : " ") + answer);
        return given === a || given === withBefore;
      });
    }

    function renderQuiz() {
      const main = document.getElementById("main");
      const q = quiz;
      const label = q.type === "x" ? "Test · Verifica" : q.type === "t" ? "Mini test"
        : q.type === "r" ? `${TYPE_NAMES[q.type]} · ${TYPE_IT[q.type]}`
        : `${q.lesson.code} ${TYPE_NAMES[q.type]} · ${TYPE_IT[q.type]}`;
      const dots = q.items.map((_, i) => {
        const a = q.answers[i];
        const cls = a === undefined ? (i === q.index && !q.finished ? "cur" : "")
          : (isExam(q) && !q.finished ? "cur" : (a ? "ok" : "no"));
        return `<span class="${cls}"></span>`;
      }).join("");

      let body = "";
      if (q.finished) body = resultHtml();
      else if (q.type === "s") body = speakHtml();
      else body = questionBlock();

      main.innerHTML = `
        <section class="quiz">
          <div class="quiz-top">
            <button class="link" type="button" id="quizBack">← Back · Indietro</button>
            <span>${esc(label)}</span>
          </div>
          <p class="lesson-topic" style="margin:0">${esc([q.lesson.title, q.type === "v" ? q.lesson.vocab : q.lesson.grammar].filter(Boolean).join(" · "))}</p>
          ${isExam(q) && !q.finished ? `<p class="note" style="margin-top:8px">${q.type === "x" ? "Test" : "Mini test"}: answer all the questions, then see your score and the answers. Your first score goes to your teacher. · Il primo risultato va all'insegnante.</p>` : ""}
          <div class="dots">${dots}</div>
          ${body}
        </section>`;

      main.querySelector("#quizBack").addEventListener("click", () => { stopListening(); quiz = null; render(); });
      if (q.finished) bindResult();
      else if (q.type === "s") bindSpeak();
      else bindQuestion();
    }

    function questionBlock() {
      const q = quiz;
      const item = q.items[q.index];
      const answered = q.answers[q.index] !== undefined;
      let html = `<p class="question">${questionHtml(item.q)}</p>`;

      if (Array.isArray(item.o)) {
        html += `<div class="options">` + item.o.map((option, i) => {
          let cls = "";
          if (answered) {
            if (isExam(quiz)) cls = i === item.picked ? "picked" : "";
            else if (i === item.a) cls = "right";
            else if (i === item.picked) cls = "wrong";
          }
          return `<button class="option ${cls}" type="button" data-i="${i}" ${answered ? "disabled" : ""}>${esc(option)}</button>`;
        }).join("") + `</div>`;
      } else {
        html += `
          <form class="typed" id="typedForm" autocomplete="off">
            <input class="big" id="typedInput" type="text" autocapitalize="off" autocorrect="off" spellcheck="false"
                   value="${esc(item.typed || "")}" ${answered ? "disabled" : ""} placeholder="Type your answer · Scrivi">
            ${answered ? "" : `<button class="primary" type="submit">Check</button>`}
          </form>`;
      }

      if (answered && isExam(q)) {
        html += `<div class="actions"><button class="primary" type="button" id="nextQ">${q.index + 1 < q.items.length ? "Next · Avanti →" : "Finish · Fine"}</button></div>`;
      } else if (answered) {
        const right = q.answers[q.index];
        const answerText = Array.isArray(item.o) ? item.o[item.a] : item.a[0];
        html += `
          <div class="feedback ${right ? "ok" : "no"}">
            <strong>${right ? "✓ Right! · Giusto!" : `✗ Not quite · Risposta: ${esc(answerText)}`}</strong>
            ${esc(item.e || "")}
          </div>
          <div class="actions"><button class="primary" type="button" id="nextQ">${q.index + 1 < q.items.length ? "Next · Avanti →" : "See my score · Risultato"}</button></div>`;
      }
      return html;
    }

    function bindQuestion() {
      const main = document.getElementById("main");
      const item = quiz.items[quiz.index];
      main.querySelectorAll(".option").forEach((button) => {
        button.addEventListener("click", () => {
          const i = Number(button.dataset.i);
          item.picked = i;
          quiz.answers[quiz.index] = i === item.a;
          renderQuiz();
        });
      });
      const form = main.querySelector("#typedForm");
      if (form && !form.querySelector("input").disabled) {
        const input = form.querySelector("input");
        input.focus();
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          if (!input.value.trim()) return;
          item.typed = input.value;
          quiz.answers[quiz.index] = quiz.type === "x" ? false : typedIsRight(item, input.value);
          renderQuiz();
        });
      }
      const next = main.querySelector("#nextQ");
      if (next) {
        next.addEventListener("click", nextItem);
        next.focus();
      }
    }

    function nextItem() {
      if (quiz.index + 1 < quiz.items.length) quiz.index++;
      else finishSet();
      renderQuiz();
    }

    function isExam(q) { return q && (q.type === "t" || q.type === "x"); }

    function finishSet() {
      quiz.finished = true;
      if (quiz.type === "x") submitTeacherTest();
      else saveResult();
    }

    function score() {
      if (quiz.type === "x") return quiz.serverScore ?? 0;
      if (quiz.type === "s") return quiz.items.filter((x) => x.best >= SPEAK_PASS).length;
      return quiz.answers.filter(Boolean).length;
    }

    function resultHtml() {
      const total = quiz.items.length;
      const got = score();
      const ok = got / total >= PRACTICE.PASS_MARK;
      if (quiz.type === "x" && quiz.saveState !== "saved") {
        return `<div class="result"><div class="saved">${quiz.saveState === "failed"
          ? "Not sent: check your connection. · Non inviato."
          : "Marking your test… · Correzione in corso…"}</div></div>
          <div class="actions">${quiz.saveState === "failed" ? `<button class="primary" type="button" id="retrySave">Send again · Riprova</button>` : ""}
          <button class="secondary" type="button" id="done">Back · Indietro</button></div>`;
      }
      const saved = {
        saving: "Saving… · Salvataggio…",
        saved: quiz.type === "x" ? "✓ Sent to your teacher · Inviato all'insegnante" : "✓ Saved to your progress · Salvato",
        failed: "Not saved: check your connection. · Non salvato.",
        offline: "Practice scores will be saved soon. · Presto salveremo i risultati."
      }[quiz.saveState] || "";
      return `
        <div class="result">
          <div>${ok ? "🎉 Great work! · Ottimo lavoro!" : "💪 Keep practising! · Continua così!"}</div>
          <div class="big-score">${got} / ${total}</div>
          <div class="saved" id="savedText">${esc(saved)}</div>
          ${ok || isExam(quiz) ? "" : `<p class="note">You need ${Math.ceil(total * PRACTICE.PASS_MARK)} or more to count towards your progress. · Ne servono almeno ${Math.ceil(total * PRACTICE.PASS_MARK)}.</p>`}
          ${isExam(quiz) ? answerList() : ""}
        </div>
        <div class="actions">
          ${quiz.saveState === "failed" ? `<button class="secondary" type="button" id="retrySave">Save again · Riprova</button>` : ""}
          <button class="secondary" type="button" id="again">Try again · Riprova</button>
          <button class="primary" type="button" id="done">${quiz.type === "x" ? "Back · Indietro" : "Back to practice · Indietro"}</button>
        </div>`;
    }

    function answerList() {
      return `<div class="answers">` + quiz.items.map((item, i) => {
        const right = quiz.answers[i];
        const mine = Array.isArray(item.o) ? (item.o[item.picked] ?? "—") : (item.typed || "—");
        const correct = item.serverAnswer ?? (Array.isArray(item.o) ? item.o[item.a] : item.a[0]);
        return `<div class="answer ${right ? "ok" : "no"}">

    /* ---------- speaking (read aloud, free: the phone's own speech recognition) ---------- */

    const SPEAK_PASS = 0.7;
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognizer = null;

    function words(text) {
      return expand(text).replace(/-/g, " ").replace(/[^a-z0-9' ]/g, " ").replace(/'/g, "").split(/\s+/).filter(Boolean);
    }

    // Longest common subsequence: which target words were heard, in order.
    function matchWords(target, heard) {
      const t = words(target), h = words(heard);
      const dp = Array.from({ length: t.length + 1 }, () => new Array(h.length + 1).fill(0));
      for (let i = t.length - 1; i >= 0; i--) {
        for (let j = h.length - 1; j >= 0; j--) {
          dp[i][j] = t[i] === h[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
        }
      }
      const hit = new Array(t.length).fill(false);
      let i = 0, j = 0;
      while (i < t.length && j < h.length) {
        if (t[i] === h[j]) { hit[i] = true; i++; j++; }
        else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
        else j++;
      }
      return { ratio: t.length ? hit.filter(Boolean).length / t.length : 0, hit };
    }

    // Colour the original sentence word by word.
    function markedSentence(text, marks) {
      if (!marks) return esc(text);
      let k = 0;
      return text.split(/(\s+)/).map((token) => {
        if (/^\s+$/.test(token) || !token) return token;
        const count = words(token).length;
        if (!count) return esc(token);
        const ok = marks.slice(k, k + count).every(Boolean);
        k += count;
        return `<span class="${ok ? "hit" : "miss"}">${esc(token)}</span>`;
      }).join("");
    }

    function speakHtml() {
      const item = quiz.items[quiz.index];
      const tried = item.heard !== "";
      const ok = item.best >= SPEAK_PASS;
      let html = `
        <p class="lesson-topic">Read this sentence aloud · Leggi ad alta voce</p>
        <p class="say">${markedSentence(item.text, item.marks)}</p>
        <div class="actions" style="margin-top:0">
          <button class="secondary" type="button" id="listen">🔊 Listen · Ascolta</button>
          ${Recognition ? `<button class="primary mic" type="button" id="mic">🎤 Speak · Parla</button>` : ""}
        </div>`;
      if (!Recognition) {
        html += `<p class="note">The speaking check doesn't work in this browser. Open your link in Chrome (Android) or Safari (iPhone).
          You can still listen and repeat. · Il controllo della pronuncia non funziona in questo browser: apri il link con Chrome o Safari.</p>`;
      }
      if (item.error) html += `<p class="note">${esc(item.error)}</p>`;
      if (tried) {
        html += `<p class="heard">I heard · Ho sentito: “${esc(item.heard)}”</p>
          <div class="feedback ${ok ? "ok" : "no"}"><strong>${ok ? "✓ Great! · Bravo/a!" : "Try again · Riprova"}</strong>
          ${ok ? "Clear and correct." : "Red words weren't clear. Listen, then try again. · Le parole in rosso non erano chiare."}</div>`;
      }
      const last = quiz.index + 1 >= quiz.items.length;
      html += `<div class="actions"><button class="${tried || !Recognition ? "primary" : "secondary"}" type="button" id="nextS">
        ${last ? "Finish · Fine" : (tried || !Recognition ? "Next · Avanti →" : "Skip · Salta →")}</button></div>`;
      return html;
    }

    function bindSpeak() {
      const main = document.getElementById("main");
      const item = quiz.items[quiz.index];

      main.querySelector("#listen").addEventListener("click", () => {
        if (!("speechSynthesis" in window)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(item.text);
        u.lang = "en-GB";
        u.rate = 0.9;
        const voice = speechSynthesis.getVoices().find((v) => /^en[-_]GB/i.test(v.lang));
        if (voice) u.voice = voice;
        speechSynthesis.speak(u);
      });

      const mic = main.querySelector("#mic");
      if (mic) mic.addEventListener("click", () => listen(mic, item));

      main.querySelector("#nextS").addEventListener("click", () => {
        stopListening();
        quiz.answers[quiz.index] = item.best >= SPEAK_PASS;
        nextItem();
      });
    }

    function stopListening() {
      if (recognizer) { try { recognizer.abort(); } catch (_) {} recognizer = null; }
    }

    function listen(button, item) {
      stopListening();
      const rec = new Recognition();
      recognizer = rec;
      rec.lang = "en-GB";
      rec.interimResults = false;
      rec.maxAlternatives = 3;
      button.classList.add("listening");
      button.textContent = "🎤 Listening… · Ascolto…";

      let handled = false;
      rec.onresult = (event) => {
        handled = true;
        item.error = "";
        const alternatives = Array.from(event.results[0] || []).map((a) => a.transcript);
        let best = { ratio: -1 };
        let heard = "";
        alternatives.forEach((text) => {
          const m = matchWords(item.text, text);
          if (m.ratio > best.ratio) { best = m; heard = text; }
        });
        item.heard = heard || "…";
        item.marks = best.hit || null;
        item.best = Math.max(item.best, best.ratio || 0);
        if (best.ratio >= SPEAK_PASS) item.marks = best.hit;
      };
      rec.onerror = (event) => {
        handled = true;
        item.error = event.error === "not-allowed" || event.error === "service-not-allowed"
          ? "Please allow the microphone for this page, then try again. · Consenti l'uso del microfono e riprova."
          : event.error === "no-speech"
            ? "I didn't hear anything. Tap Speak and read the sentence. · Non ho sentito niente: riprova."
            : event.error === "aborted" ? "" : "The speaking check isn't working right now. Check your internet connection. · Controlla la connessione.";
      };
      rec.onend = () => {
        if (recognizer === rec) recognizer = null;
        if (quiz && quiz.items[quiz.index] === item) renderQuiz();
      };
      try { rec.start(); } catch (_) { renderQuiz(); }
    }

    function chatListen(button) {
      stopListening();
      try { speechSynthesis.cancel(); } catch (_) {}
      const rec = new Recognition();
      recognizer = rec;
      rec.lang = "en-GB";
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      button.classList.add("listening");
      button.textContent = "🎤 Listening… · Ascolto…";

          ? "Please allow the microphone for this page. · Consenti l'uso del microfono."
          : event.error === "no-speech" ? "I didn't hear anything. Try again. · Non ho sentito niente." : "";
      };
      rec.onend = () => {
        if (recognizer === rec) recognizer = null;
        if (!chat) return;
        if (heard) sendChat(heard);
        else renderChat();
      };
      try { rec.start(); } catch (_) { renderChat(); }
    }

    async function sendChat(text) {
      const c = chat;
      if (!c || c.busy) return;
      c.error = "";
      const history = c.messages.map((m) => ({ r: m.r, t: m.t }));
      let mine = null;
      if (text) { mine = { r: "s", t: text, fix: "" }; c.messages.push(mine); }
      c.busy = true;
      renderChat();
      try {
        const result = await api({
          action: "mutate",
          payload: JSON.stringify({ action: "coachTurn", key: KEY, level: c.level, topic: c.topic, history, text })
        });
        if (chat !== c) return;
        if (mine && result.fix) mine.fix = result.fix;
        c.messages.push({ r: "c", t: result.reply });
        data.coach.repliesLeft = result.repliesLeft;
        if (c.voice) sayAloud(result.reply);
      } catch (error) {
        if (chat !== c) return;
        const msg = String(error.message || "");
        if (/COACH_LIMIT/.test(msg)) { c.error = "You've used all your coach time this month. · Tempo esaurito per questo mese."; data.coach.repliesLeft = 0; }
        else if (/COACH_OFF/.test(msg)) { c.error = "The Speaking Coach isn't active for you. Ask at the school office. · Chiedi in segreteria."; data.coach.active = false; }
        else if (/AI_NOT_SET_UP/.test(msg)) c.error = "The coach isn't ready yet. Try again soon. · Non ancora pronto.";
        else c.error = /busy/i.test(msg) ? msg : "The coach couldn't answer. Check your connection and try again. · Riprova.";
        if (mine) { c.messages.pop(); c.retryText = text; }
      } finally {
        if (chat === c) {
          c.busy = false;
          renderChat();
          if (c.retryText) {
            const input = document.getElementById("chatInput");
            if (input) input.value = c.retryText;
            c.retryText = "";
          }
        }
      }
    }

          document.getElementById("main").innerHTML = `<div class="empty">Ciao ${esc(result.firstName || "")}! Caricamento… · Loading…</div>`;
          load();
        } catch (error) {
          msg.textContent = /Unknown mutation/i.test(error.message || "") ? "Il login con codice non è ancora attivo: usa il QR. · Code login isn't switched on yet." : (error.message || "Errore. Riprova.");
          btn.disabled = false; btn.textContent = "Entra · Log in";
        }
      });
      setTimeout(() => input.focus(), 50);
    }

    document.getElementById("switchStudent")?.addEventListener("click", (event) => {
      event.preventDefault();
      try { localStorage.removeItem(STORE); } catch (_) {}
      location.href = "homework.html";
    });

    async function load() {
      if (KEY.length < 20) {
        showLogin();
        return;
      }
      try {
        data = await api({ action: "getStudentHomework", key: KEY });
        data.practice = Array.isArray(data.practice) ? data.practice : [];
        data.tests = Array.isArray(data.tests) ? data.tests : [];
        data.testResults = Array.isArray(data.testResults) ? data.testResults : [];
        render();
        document.getElementById("switchWrap").hidden = false;
      } catch (error) {
        if (/not valid/i.test(error.message || "")) {
          try { if (localStorage.getItem(STORE) === KEY) localStorage.removeItem(STORE); } catch (_) {}
          KEY = "";
          showLogin("Questo link non è più valido: entra con il tuo codice. · This link no longer works: log in with your code.");
          return;
        }
        showError(error.message || "Could not load your homework. Please try again later.");
      }
    }

    load();
  </script>
</body>
</html>
