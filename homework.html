      }[quiz.saveState] || "";
      return `
        <div class="result">
          <div>${ok ? "🎉 Great work! · Ottimo lavoro!" : "💪 Keep practising! · Continua così!"}</div>
          <div class="big-score">${got} / ${total}</div>
          <div class="saved" id="savedText">${esc(saved)}</div>
          ${ok || isExam(quiz) ? "" : `<p class="note">You need ${Math.ceil(total * PRACTICE.PASS_MARK)} or more to count towards your progress. · Ne servono almeno ${Math.ceil(total * PRACTICE.PASS_MARK)}.</p>`}
          ${isExam(quiz) ? answerList() : ""}
        </div>
        <div class="actions">
          ${quiz.saveState === "failed" ? `<button class="secondary" type="button" id="retrySave">Save again · Riprova</button>` : ""}
          <button class="secondary" type="button" id="again">Try again · Riprova</button>
          <button class="primary" type="button" id="done">${quiz.type === "x" ? "Back · Indietro" : "Back to practice · Indietro"}</button>
        </div>`;
    }

    function answerList() {
      return `<div class="answers">` + quiz.items.map((item, i) => {
        const right = quiz.answers[i];
        const mine = Array.isArray(item.o) ? (item.o[item.picked] ?? "—") : (item.typed || "—");
        const correct = item.serverAnswer ?? (Array.isArray(item.o) ? item.o[item.a] : item.a[0]);
        return `<div class="answer ${right ? "ok" : "no"}">
          <p><strong>${i + 1}. ${right ? "✓" : "✗"}</strong> ${questionHtml(item.q)}</p>
          ${right ? "" : `<p>Your answer · La tua risposta: ${esc(mine)}</p><p><strong>Answer · Risposta: ${esc(correct)}</strong></p>`}
          <p class="meta">${esc(item.e || "")}</p>
        </div>`;
      }).join("") + `</div>`;
    }

    function bindResult() {
      const main = document.getElementById("main");
      main.querySelector("#again")?.addEventListener("click", () => {
        if (quiz.type === "x") startTeacherTest(quiz.testId);
        else if (quiz.type === "r" || quiz.type === "t") startExtra(quiz.courseId, quiz.type, quiz.n);
        else startSet(quiz.courseId, quiz.code, quiz.type);
      });
      main.querySelector("#done").addEventListener("click", () => { quiz = null; render(); });
      const retry = main.querySelector("#retrySave");
      if (retry) retry.addEventListener("click", quiz.type === "x" ? submitTeacherTest : saveResult);
    }

    /* ---------- teachers' own tests (marked on the server) ---------- */

    function testResultFor(testId) {
      return (data.testResults || []).find((r) => r.testId === testId) || null;
    }

    function startTeacherTest(testId) {
      const test = (data.tests || []).find((t) => t.testId === testId);
      if (!test) return;
      const cls = data.classes.find((c) => String(c["Class ID"]) === test.classId);
      quiz = {
        type: "x", testId, code: testId,
        lesson: { code: testId, title: test.title, grammar: cls ? cls["Class Name"] : "", vocab: "" },
        items: test.questions.map((q) => ({ ...q })),
        index: 0, answers: [], finished: false, saveState: ""
      };
      window.scrollTo(0, 0);
      render();
    }

    async function submitTeacherTest() {
      const q = quiz;
      q.saveState = "saving";
      render();
      const answers = q.items.map((item) => Array.isArray(item.o) ? (item.picked ?? null) : (item.typed || ""));
      try {
        const result = await api({
          action: "mutate",
          payload: JSON.stringify({ action: "studentSubmitTest", key: KEY, testId: q.testId, answers })
        });
        q.serverScore = result.score;
        result.review.forEach((r, i) => {
          q.answers[i] = r.right;
          q.items[i].serverAnswer = r.answer;
          q.items[i].e = r.e;
        });
        data.testResults = data.testResults || [];
        const existing = testResultFor(q.testId);
        const row = { testId: q.testId, first: result.first, best: result.best, total: result.total, attempts: result.attempts };
        if (existing) Object.assign(existing, row); else data.testResults.push(row);
        q.saveState = "saved";
      } catch (error) {
        q.saveState = "failed";
      }
      if (quiz === q) render();
    }

    async function saveResult() {
      const q = quiz;
      const total = q.items.length;
      const got = score();
      q.saveState = "saving";
      try {
        const result = await api({
          action: "mutate",
          payload: JSON.stringify({ action: "studentSavePractice", key: KEY, setId: q.setId, score: got, total })
        });
        data.practice = data.practice || [];
        const existing = data.practice.find((r) => r.setId === q.setId);
        const row = { setId: q.setId, best: result.best, total: result.total, attempts: result.attempts, date: result.date, first: existing && existing.first != null ? existing.first : got };
        if (existing) Object.assign(existing, row);
        else data.practice.push(row);
        q.saveState = "saved";
      } catch (error) {
        q.saveState = /unknown mutation/i.test(error.message || "") ? "offline" : "failed";
      }
      if (quiz === q) render();
    }

    /* ---------- speaking (read aloud, free: the phone's own speech recognition) ---------- */

    const SPEAK_PASS = 0.7;
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognizer = null;

    function words(text) {
      return expand(text).replace(/-/g, " ").replace(/[^a-z0-9' ]/g, " ").replace(/'/g, "").split(/\s+/).filter(Boolean);
    }

    // Longest common subsequence: which target words were heard, in order.
    function matchWords(target, heard) {
      const t = words(target), h = words(heard);
      const dp = Array.from({ length: t.length + 1 }, () => new Array(h.length + 1).fill(0));
      for (let i = t.length - 1; i >= 0; i--) {
        for (let j = h.length - 1; j >= 0; j--) {
          dp[i][j] = t[i] === h[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
        }
      }
      const hit = new Array(t.length).fill(false);
      let i = 0, j = 0;
      while (i < t.length && j < h.length) {
        if (t[i] === h[j]) { hit[i] = true; i++; j++; }
        else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
        else j++;
      }
      return { ratio: t.length ? hit.filter(Boolean).length / t.length : 0, hit };
    }

    // Colour the original sentence word by word.
    function markedSentence(text, marks) {
      if (!marks) return esc(text);
      let k = 0;
      return text.split(/(\s+)/).map((token) => {
        if (/^\s+$/.test(token) || !token) return token;
        const count = words(token).length;
        if (!count) return esc(token);
        const ok = marks.slice(k, k + count).every(Boolean);
        k += count;
        return `<span class="${ok ? "hit" : "miss"}">${esc(token)}</span>`;
      }).join("");
    }

    function speakHtml() {
      const item = quiz.items[quiz.index];
      const tried = item.heard !== "";
      const ok = item.best >= SPEAK_PASS;
      let html = `
        <p class="lesson-topic">Read this sentence aloud · Leggi ad alta voce</p>
        <p class="say">${markedSentence(item.text, item.marks)}</p>
        <div class="actions" style="margin-top:0">
          <button class="secondary" type="button" id="listen">🔊 Listen · Ascolta</button>
          ${Recognition ? `<button class="primary mic" type="button" id="mic">🎤 Speak · Parla</button>` : ""}
        </div>`;
      if (!Recognition) {
        html += `<p class="note">The speaking check doesn't work in this browser. Open your link in Chrome (Android) or Safari (iPhone).
          You can still listen and repeat. · Il controllo della pronuncia non funziona in questo browser: apri il link con Chrome o Safari.</p>`;
      }
      if (item.error) html += `<p class="note">${esc(item.error)}</p>`;
      if (tried) {
        html += `<p class="heard">I heard · Ho sentito: “${esc(item.heard)}”</p>
          <div class="feedback ${ok ? "ok" : "no"}"><strong>${ok ? "✓ Great! · Bravo/a!" : "Try again · Riprova"}</strong>
          ${ok ? "Clear and correct." : "Red words weren't clear. Listen, then try again. · Le parole in rosso non erano chiare."}</div>`;
      }
      const last = quiz.index + 1 >= quiz.items.length;
      html += `<div class="actions"><button class="${tried || !Recognition ? "primary" : "secondary"}" type="button" id="nextS">
        ${last ? "Finish · Fine" : (tried || !Recognition ? "Next · Avanti →" : "Skip · Salta →")}</button></div>`;
      return html;
    }

    function bindSpeak() {
      const main = document.getElementById("main");
      const item = quiz.items[quiz.index];

      main.querySelector("#listen").addEventListener("click", () => {
        if (!("speechSynthesis" in window)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(item.text);
        u.lang = "en-GB";
        u.rate = 0.9;
        const voice = speechSynthesis.getVoices().find((v) => /^en[-_]GB/i.test(v.lang));
        if (voice) u.voice = voice;
        speechSynthesis.speak(u);
      });

      const mic = main.querySelector("#mic");
      if (mic) mic.addEventListener("click", () => listen(mic, item));

      main.querySelector("#nextS").addEventListener("click", () => {
        stopListening();
        quiz.answers[quiz.index] = item.best >= SPEAK_PASS;
        nextItem();
      });
    }

    function stopListening() {
      if (recognizer) { try { recognizer.abort(); } catch (_) {} recognizer = null; }
    }

    function listen(button, item) {
      stopListening();
      const rec = new Recognition();
      recognizer = rec;
      rec.lang = "en-GB";
      rec.interimResults = false;
      rec.maxAlternatives = 3;
      button.classList.add("listening");
      button.textContent = "🎤 Listening… · Ascolto…";

      let handled = false;
      rec.onresult = (event) => {
        handled = true;
        item.error = "";
        const alternatives = Array.from(event.results[0] || []).map((a) => a.transcript);
        let best = { ratio: -1 };
        let heard = "";
        alternatives.forEach((text) => {
          const m = matchWords(item.text, text);
          if (m.ratio > best.ratio) { best = m; heard = text; }
        });
        item.heard = heard || "…";
        item.marks = best.hit || null;
        item.best = Math.max(item.best, best.ratio || 0);
        if (best.ratio >= SPEAK_PASS) item.marks = best.hit;
      };
      rec.onerror = (event) => {
        handled = true;
        item.error = event.error === "not-allowed" || event.error === "service-not-allowed"
          ? "Please allow the microphone for this page, then try again. · Consenti l'uso del microfono e riprova."
          : event.error === "no-speech"
            ? "I didn't hear anything. Tap Speak and read the sentence. · Non ho sentito niente: riprova."
            : event.error === "aborted" ? "" : "The speaking check isn't working right now. Check your internet connection. · Controlla la connessione.";
      };
      rec.onend = () => {
        if (recognizer === rec) recognizer = null;
        if (quiz && quiz.items[quiz.index] === item) renderQuiz();
      };
      try { rec.start(); } catch (_) { renderQuiz(); }
    }


    /* ---------- AI Speaking Coach (paid extra, V19) ---------- */

    let chat = null;

    function coachTopics() {
      const topics = [];
      const books = myBooks();
      const extra = chosenBook();
      const book = books[0] || (COURSES[extra] ? { id: extra, units: "", current: "" } : null);
      if (book && COURSES[book.id]) {
        const course = COURSES[book.id];
        const range = PRACTICE.parseUnits(book.id, book.units);
        const cur = Number(book.current) || range.to;
        course.lessons
          .filter((l) => l.unit >= range.from && l.unit <= cur)
          .reverse()
          .slice(0, 8)
          .forEach((l) => topics.push({
            label: `${l.code} · ${l.title}`,
            topic: `${l.title} (practise: ${l.grammar}; words: ${l.vocab})`,
            level: course.level
          }));
      }
      const level = topics[0]?.level || "B1";
      topics.push({ label: "Free chat · Conversazione libera", topic: "free conversation about the student's everyday life, hobbies and plans", level });
      topics.push({ label: "Holidays and travel · Viaggi", topic: "holidays, travel and places in Sicily and abroad", level });
      topics.push({ label: "Food · Cibo", topic: "food, cooking and eating out", level });
      return topics;
    }

    function minutesLeft(replies) {
      return Math.max(0, Math.floor(Number(replies || 0) / 3));
    }

    function coachCard() {
      const c = data.coach;
      if (!c) return "";
      if (!c.active) {
        const req = String(c.requested || "");
        const reqPlan = /year$/.test(req) ? "year" : "month";
        return `
          <section class="coach-card">
            <h3>🗣️ AI Speaking Coach <span class="coach-badge">Extra</span></h3>
            <p><strong>Parla inglese quando vuoi, anche a casa.</strong> Il Coach è un'intelligenza artificiale che ti ascolta, ti risponde a voce e ti mostra come correggere gli errori. · Talk in English any time: the coach listens, answers out loud and helps you fix your mistakes.</p>
            <ul class="coach-list">
              <li>Conversazioni sugli argomenti delle tue unità · Topics from your units</li>
              <li>Una correzione gentile a ogni risposta · A gentle correction each time</li>
              <li>Circa 60 minuti al mese · About 60 minutes a month</li>
            </ul>
            <p class="coach-price">€3 al mese <span>oppure</span> €25 per tutto l'anno</p>
            ${req
              ? `<p class="coach-sent">✓ Richiesta inviata (${reqPlan === "year" ? "€25 anno" : "€3 mese"}). Paga in segreteria e lo attiviamo. · Request sent: pay at the office and we'll switch it on.</p>`
              : `<div class="coach-actions">
                   <button class="primary" type="button" data-coach-plan="month">Voglio attivarlo · €3/mese</button>
                   <button class="primary" type="button" data-coach-plan="year">Tutto l'anno · €25</button>
                 </div>
                 <p class="meta" style="margin:8px 0 0">Nessun pagamento online: paghi in segreteria. · No online payment: you pay at the office.</p>`}
          </section>`;
      }
      if (!c.ready) {
        return `
          <section class="coach-card">
            <h3>🗣️ AI Speaking Coach</h3>
            <p style="margin:0">Your coach is almost ready. Try again soon! · Quasi pronto, riprova presto!</p>
          </section>`;
      }
      if (c.repliesLeft <= 0) {
        return `
          <section class="coach-card">
            <h3>🗣️ AI Speaking Coach</h3>
            <p style="margin:0">You've used all your coach time this month. It starts again on the 1st. · Tempo esaurito per questo mese.</p>
          </section>`;
      }
      const options = coachTopics().map((t, i) => `<option value="${i}">${esc(t.label)}</option>`).join("");
      return `
        <section class="coach-card">
          <h3>🗣️ AI Speaking Coach</h3>
          <p>Choose a topic and start talking. · Scegli un argomento e parla.</p>
          <select class="big" id="coachTopic">${options}</select>
          <button class="primary" type="button" id="coachStart">Start talking · Inizia</button>
          <p class="meta" style="margin:8px 0 0">About ${minutesLeft(c.repliesLeft)} minutes left this month · Circa ${minutesLeft(c.repliesLeft)} minuti</p>
        </section>`;
    }

    function bindCoachCard() {
      document.querySelectorAll("[data-coach-plan]").forEach((button) => {
        button.addEventListener("click", async () => {
          document.querySelectorAll("[data-coach-plan]").forEach((b) => { b.disabled = true; });
          button.textContent = "Invio… · Sending…";
          try {
            const result = await api({
              action: "mutate",
              payload: JSON.stringify({ action: "studentRequestCoach", key: KEY, plan: button.dataset.coachPlan })
            });
            data.coach.requested = result.requested;
          } catch (error) {
            alert("Non è stato possibile inviare la richiesta. Riprova. · Could not send the request.");
          }
          render();
        });
      });
      const start = document.getElementById("coachStart");
      if (!start) return;
      start.addEventListener("click", () => {
        const picked = coachTopics()[Number(document.getElementById("coachTopic").value) || 0];
        // iPhones only allow speech after a tap: unlock it now.
        try { speechSynthesis.speak(new SpeechSynthesisUtterance("")); } catch (_) {}
        chat = { topic: picked.topic, label: picked.label, level: picked.level, messages: [], busy: false, error: "", voice: true };
        window.scrollTo(0, 0);
        render();
        sendChat("");
      });
    }

    function sayAloud(text) {
      if (!("speechSynthesis" in window) || !text) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-GB";
      u.rate = 0.95;
      const voice = speechSynthesis.getVoices().find((v) => /^en[-_]GB/i.test(v.lang));
      if (voice) u.voice = voice;
      speechSynthesis.speak(u);
    }

    function endChat() {
      stopListening();
      try { speechSynthesis.cancel(); } catch (_) {}
      chat = null;
    }

    function renderChat() {
      const main = document.getElementById("main");
      const c = chat;
      const bubbles = c.messages.map((m, i) => m.r === "c"
        ? `<div class="bubble c">${esc(m.t)}<button class="replay" type="button" data-say="${i}" aria-label="Listen">🔊</button></div>`
        : `<div class="bubble s">${esc(m.t)}${m.fix ? `<span class="fix">✎ Better: ${esc(m.fix)}</span>` : ""}</div>`
      ).join("") + (c.busy ? `<div class="bubble c thinking">Coach is thinking… · Sto pensando…</div>` : "");

      main.innerHTML = `
        <section class="quiz">
          <div class="quiz-top">
            <button class="link" type="button" id="chatEnd">← End · Fine</button>
            <span>🗣️ ${esc(c.label)}</span>
          </div>
          <div class="chat" id="chatLog">${bubbles}</div>
          ${c.error ? `<p class="note">${esc(c.error)}</p>` : ""}
          <div class="chat-controls">
            ${Recognition ? `<button class="primary mic" type="button" id="chatMic" ${c.busy ? "disabled" : ""}>🎤 Speak · Parla</button>` : ""}
            <form id="chatForm" autocomplete="off">
              <input class="big" id="chatInput" type="text" placeholder="…or type · …oppure scrivi" ${c.busy ? "disabled" : ""}>
              <button class="secondary" type="submit" ${c.busy ? "disabled" : ""}>Send</button>
            </form>
            <label class="meta" style="display:flex;gap:6px;align-items:center">
              <input type="checkbox" id="chatVoice" ${c.voice ? "checked" : ""}> Read the coach's answers aloud · Leggi ad alta voce
            </label>
            <p class="meta" style="margin:0">About ${minutesLeft(data.coach.repliesLeft)} minutes left this month</p>
          </div>
        </section>`;

      main.querySelector("#chatEnd").addEventListener("click", () => { endChat(); render(); });
      main.querySelectorAll("[data-say]").forEach((b) => b.addEventListener("click", () => sayAloud(c.messages[Number(b.dataset.say)].t)));
      main.querySelector("#chatVoice").addEventListener("change", (e) => { c.voice = e.target.checked; if (!c.voice) speechSynthesis.cancel(); });
      main.querySelector("#chatForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const input = main.querySelector("#chatInput");
        if (input.value.trim() && !c.busy) sendChat(input.value.trim());
      });
      const mic = main.querySelector("#chatMic");
      if (mic) mic.addEventListener("click", () => chatListen(mic));
      const log = main.querySelector("#chatLog");
      log.lastElementChild?.scrollIntoView({ block: "nearest" });
    }

    function chatListen(button) {
      stopListening();
      try { speechSynthesis.cancel(); } catch (_) {}
      const rec = new Recognition();
      recognizer = rec;
      rec.lang = "en-GB";
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      button.classList.add("listening");
      button.textContent = "🎤 Listening… · Ascolto…";
      let heard = "";
      rec.onresult = (event) => { heard = String(event.results[0]?.[0]?.transcript || "").trim(); };
      rec.onerror = (event) => {
        if (!chat) return;
        chat.error = event.error === "not-allowed" || event.error === "service-not-allowed"
          ? "Please allow the microphone for this page. · Consenti l'uso del microfono."
          : event.error === "no-speech" ? "I didn't hear anything. Try again. · Non ho sentito niente." : "";
      };
      rec.onend = () => {
        if (recognizer === rec) recognizer = null;
        if (!chat) return;
        if (heard) sendChat(heard);
        else renderChat();
      };
      try { rec.start(); } catch (_) { renderChat(); }
    }

    async function sendChat(text) {
      const c = chat;
      if (!c || c.busy) return;
      c.error = "";
      const history = c.messages.map((m) => ({ r: m.r, t: m.t }));
      let mine = null;
      if (text) { mine = { r: "s", t: text, fix: "" }; c.messages.push(mine); }
      c.busy = true;
      renderChat();
      try {
        const result = await api({
          action: "mutate",
          payload: JSON.stringify({ action: "coachTurn", key: KEY, level: c.level, topic: c.topic, history, text })
        });
        if (chat !== c) return;
        if (mine && result.fix) mine.fix = result.fix;
        c.messages.push({ r: "c", t: result.reply });
        data.coach.repliesLeft = result.repliesLeft;
        if (c.voice) sayAloud(result.reply);
      } catch (error) {
        if (chat !== c) return;
        const msg = String(error.message || "");
        if (/COACH_LIMIT/.test(msg)) { c.error = "You've used all your coach time this month. · Tempo esaurito per questo mese."; data.coach.repliesLeft = 0; }
        else if (/COACH_OFF/.test(msg)) { c.error = "The Speaking Coach isn't active for you. Ask at the school office. · Chiedi in segreteria."; data.coach.active = false; }
        else if (/AI_NOT_SET_UP/.test(msg)) c.error = "The coach isn't ready yet. Try again soon. · Non ancora pronto.";
        else c.error = /busy/i.test(msg) ? msg : "The coach couldn't answer. Check your connection and try again. · Riprova.";
        if (mine) { c.messages.pop(); c.retryText = text; }
      } finally {
        if (chat === c) {
          c.busy = false;
          renderChat();
          if (c.retryText) {
            const input = document.getElementById("chatInput");
            if (input) input.value = c.retryText;
            c.retryText = "";
          }
        }
      }
    }

    /* ---------- load ---------- */

    function showError(message) {
      document.getElementById("main").innerHTML = `<div class="error">${esc(message)}</div>`;
    }

    // V24: Student Portal login with the personal code from the school's slip.
    function showLogin(message) {
      document.getElementById("tabs").hidden = true;
      document.getElementById("progressCard").hidden = true;
      document.getElementById("hello").textContent = "Student Portal";
      document.getElementById("subtitle").textContent = "Area studenti · compiti, esercizi e progressi";
      document.getElementById("main").innerHTML = `
        <form class="login-card" id="loginForm" autocomplete="off">
          <h2>Entra con il tuo codice · Log in</h2>
          <p>Scrivi il codice personale che ti ha dato la scuola (per esempio <strong>K7M4-P2QX</strong>).</p>
          <label for="codeInput">Codice · Your code</label>
          <input class="code-input" id="codeInput" maxlength="12" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" required>
          <div class="login-msg" id="loginMsg" role="alert">${esc(message || "")}</div>
          <button class="primary" type="submit" id="loginBtn">Entra · Log in</button>
          <div class="login-tips">
            <div>📷 Hai il foglietto con il QR? Inquadralo con la fotocamera: entri subito.</div>
            <div>📱 Dopo l'accesso, aggiungi la pagina alla schermata Home (iPhone: Condividi → «Aggiungi alla schermata Home»; Android: ⋮ → «Installa app»).</div>
            <div>❓ Non hai il codice? Chiedi alla segreteria o al tuo insegnante.</div>
          </div>
        </form>`;
      const input = document.getElementById("codeInput");
      input.addEventListener("input", () => {
        const raw = input.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
        input.value = raw.length > 4 ? raw.slice(0, 4) + "-" + raw.slice(4) : raw;
      });
      document.getElementById("loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const code = input.value.trim();
        const msg = document.getElementById("loginMsg");
        const btn = document.getElementById("loginBtn");
        if (code.replace(/[^A-Za-z0-9]/g, "").length !== 8) { msg.textContent = "Il codice ha 8 caratteri · The code has 8 characters."; return; }
        btn.disabled = true; btn.textContent = "…";
        msg.textContent = "";
        try {
          const result = await api({ action: "mutate", payload: JSON.stringify({ action: "studentCodeLogin", code }) });
          KEY = result.key;
          try { localStorage.setItem(STORE, KEY); } catch (_) {}
          // Put the key in the address so "Add to Home Screen" keeps the student logged in.
          history.replaceState(null, "", "homework.html?k=" + encodeURIComponent(KEY) + location.hash);
          document.getElementById("main").innerHTML = `<div class="empty">Ciao ${esc(result.firstName || "")}! Caricamento… · Loading…</div>`;
          load();
        } catch (error) {
          msg.textContent = /Unknown mutation/i.test(error.message || "") ? "Il login con codice non è ancora attivo: usa il QR. · Code login isn't switched on yet." : (error.message || "Errore. Riprova.");
          btn.disabled = false; btn.textContent = "Entra · Log in";
        }
      });
      setTimeout(() => input.focus(), 50);
    }

    document.getElementById("switchStudent")?.addEventListener("click", (event) => {
      event.preventDefault();
      try { localStorage.removeItem(STORE); } catch (_) {}
      location.href = "homework.html";
    });

    async function load() {
      if (KEY.length < 20) {
        showLogin();
        return;
      }
      try {
        data = await api({ action: "getStudentHomework", key: KEY });
        data.practice = Array.isArray(data.practice) ? data.practice : [];
        data.tests = Array.isArray(data.tests) ? data.tests : [];
        data.testResults = Array.isArray(data.testResults) ? data.testResults : [];
        render();
        document.getElementById("switchWrap").hidden = false;
      } catch (error) {
        if (/not valid/i.test(error.message || "")) {
          try { if (localStorage.getItem(STORE) === KEY) localStorage.removeItem(STORE); } catch (_) {}
          KEY = "";
          showLogin("Questo link non è più valido: entra con il tuo codice. · This link no longer works: log in with your code.");
          return;
        }
        showError(error.message || "Could not load your homework. Please try again later.");
      }
    }

    load();
  </script>

  <script>
    // Little celebration when a student marks homework done (visual only).
    (function () {
      var EMOJI = ["⭐", "🎉", "✨", "💫", "🌟"];
      function burst(r) {
        for (var i = 0; i < 12; i++) {
          var s = document.createElement("span");
          s.className = "lls-burst";
          s.textContent = EMOJI[i % EMOJI.length];
          s.style.left = (r.left + r.width / 2 - 11) + "px";
          s.style.top = (r.top + r.height / 2 - 11) + "px";
          var a = (Math.PI * 2 * i) / 12;
          s.style.setProperty("--dx", Math.round(Math.cos(a) * 70) + "px");
          s.style.setProperty("--dy", Math.round(Math.sin(a) * 70 - 20) + "px");
          s.style.setProperty("--rot", (i * 40) + "deg");
          document.body.appendChild(s);
          setTimeout(function (n) { return function () { n.remove(); }; }(s), 950);
        }
      }
      window.llsCelebrate = function (rect) { try { burst(rect); } catch (e) {} };
    })();
  </script>
